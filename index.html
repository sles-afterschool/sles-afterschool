<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>臺北市雙蓮國小・社團報名系統｜115上學期暨暑期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   Design tokens
   ═══════════════════════════════════════════════════ */
:root{
  --primary:#1a5fa8;
  --primary-dark:#134777;
  --primary-soft:#e8f0fb;
  --primary-tint:#f3f7fc;
  --accent:#e05c2a;
  --accent-soft:#fce5cd;
  --success:#1e8a5e;
  --success-soft:#e0f2e9;
  --purple:#7c5dc8;
  --purple-soft:#ece6f8;
  --warn:#c97a1a;
  --warn-soft:#fff4e0;
  --danger:#c0392b;
  --ink:#1f2937;
  --ink-soft:#4b5563;
  --ink-mute:#6b7280;
  --line:#e5e7eb;
  --line-soft:#f1f3f5;
  --bg:#f7f9fc;
  --card:#ffffff;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
  --shadow:0 4px 16px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 18px 48px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg);
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none}
input,select,textarea{font-family:inherit; font-size:inherit}
a{color:inherit; text-decoration:none}

/* ═══════════════════════════════════════════════════
   Layout shells
   ═══════════════════════════════════════════════════ */
.app{min-height:100vh; display:flex; flex-direction:column}
.topbar{
  background:#fff; border-bottom:1px solid var(--line);
  padding:14px 24px;
  display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:50;
}
.topbar .crest{
  width:42px; height:42px; border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; display:grid; place-items:center;
  font-weight:900; font-size:18px;
  box-shadow:0 4px 10px rgba(26,95,168,.25);
}
.topbar .school{display:flex; flex-direction:column; line-height:1.25}
.topbar .school .name{font-weight:700; font-size:16px}
.topbar .school .sys{font-size:12px; color:var(--ink-mute)}
.topbar nav{margin-left:auto; display:flex; gap:8px; align-items:center}
.topbar nav button{
  padding:8px 14px; border-radius:8px; font-size:14px; color:var(--ink-soft);
  font-weight:500;
}
.topbar nav button:hover{background:var(--primary-soft); color:var(--primary)}
.topbar nav button.active{background:var(--primary); color:#fff}
.topbar nav .home-btn{
  display:none; padding:7px 14px; border-radius:8px; font-size:14px;
  color:var(--primary); font-weight:600; border:1px solid var(--primary-soft);
  background:var(--primary-soft);
}
.topbar nav .home-btn:hover{background:var(--primary); color:#fff; border-color:var(--primary)}
.topbar nav .gear{
  width:34px; height:34px; border-radius:8px; display:inline-grid; place-items:center;
  color:var(--ink-mute); padding:0; line-height:1; vertical-align:middle;
}
.topbar nav .gear:hover{background:var(--line-soft); color:var(--primary)}

.container{max-width:1180px; margin:0 auto; padding:28px 24px 80px; width:100%}

/* ═══════════════════════════════════════════════════
   Buttons
   ═══════════════════════════════════════════════════ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 20px; border-radius:10px;
  font-weight:500; font-size:15px;
  background:#fff; color:var(--ink); border:1px solid var(--line);
  transition:all .15s ease;
}
.btn:hover{background:var(--line-soft); border-color:#d4d8de}
.btn-primary{background:var(--primary); color:#fff; border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark); border-color:var(--primary-dark)}
.btn-accent{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn-accent:hover{background:#c44e1f; border-color:#c44e1f}
.btn-success{background:var(--success); color:#fff; border-color:var(--success)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-lg{padding:14px 26px; font-size:16px}
.btn-sm{padding:7px 12px; font-size:13px}

/* ═══════════════════════════════════════════════════
   Cards / common
   ═══════════════════════════════════════════════════ */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm)}
.section-title{display:flex; align-items:baseline; gap:12px; margin:28px 0 16px}
.section-title h2{margin:0; font-size:22px; font-weight:700}
.section-title .sub{color:var(--ink-mute); font-size:14px}
.muted{color:var(--ink-mute)}
.tag{
  display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px;
  font-size:12px; font-weight:500; line-height:1.6;
  background:var(--line-soft); color:var(--ink-soft);
}
.tag.new{background:var(--accent-soft); color:var(--accent)}
.tag.full{background:#fde2e2; color:var(--danger)}
.tag.sport{background:#e3effb; color:var(--primary)}
.tag.art{background:var(--purple-soft); color:var(--purple)}
.divider{height:1px; background:var(--line); margin:18px 0}

/* ═══════════════════════════════════════════════════
   Landing
   ═══════════════════════════════════════════════════ */
.hero{
  background:linear-gradient(135deg,#1a5fa8 0%, #2670bd 60%, #3a8bd8 100%);
  color:#fff; border-radius:var(--r-xl); padding:36px 36px 32px;
  position:relative; overflow:hidden;
}
.hero::before{
  content:""; position:absolute; right:-80px; top:-80px;
  width:340px; height:340px; border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero::after{
  content:""; position:absolute; right:80px; bottom:-120px;
  width:240px; height:240px; border-radius:50%;
  background:rgba(255,255,255,.06);
}
.hero .eyebrow{font-size:13px; letter-spacing:.18em; opacity:.85; font-weight:500}
.hero h1{margin:8px 0 6px; font-size:34px; font-weight:900; letter-spacing:-.01em}
.hero .lede{opacity:.9; font-size:15px; max-width:580px}
.hero .meta{display:flex; gap:24px; margin-top:18px; flex-wrap:wrap; position:relative; z-index:1}
.hero .meta .it{display:flex; align-items:center; gap:8px; font-size:14px; opacity:.92}
.hero .meta .dot{width:6px; height:6px; border-radius:50%; background:#fff}

.entries{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:22px}
.entry{
  border-radius:var(--r-lg); padding:24px 22px 22px;
  border:1px solid var(--line); background:#fff;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  cursor:pointer; position:relative; overflow:hidden;
  display:flex; flex-direction:column; min-height:200px;
}
.entry:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:transparent}
.entry .badge{
  width:48px; height:48px; border-radius:14px; display:grid; place-items:center;
  font-size:24px; margin-bottom:14px;
}
.entry h3{margin:0 0 4px; font-size:19px; font-weight:700}
.entry .sub{color:var(--ink-mute); font-size:13.5px; margin-bottom:14px}
.entry .stat{display:flex; gap:10px; margin-top:auto; font-size:13px; color:var(--ink-soft)}
.entry .stat strong{color:var(--ink); font-weight:700}
.entry.blue .badge{background:var(--primary-soft); color:var(--primary)}
.entry.blue:hover{box-shadow:0 18px 40px rgba(26,95,168,.18)}
.entry.orange .badge{background:#fdebde; color:var(--accent)}
.entry.orange:hover{box-shadow:0 18px 40px rgba(224,92,42,.18)}
.entry.purple .badge{background:var(--purple-soft); color:var(--purple)}
.entry.purple:hover{box-shadow:0 18px 40px rgba(124,93,200,.18)}
.entry .arrow{position:absolute; right:18px; top:22px; color:var(--ink-mute); transition:transform .18s ease}
.entry:hover .arrow{transform:translateX(4px); color:var(--primary)}

/* Timeline */
.timeline{padding:24px 26px}
.timeline h3{margin:0 0 4px; font-size:18px}
.timeline .lede{color:var(--ink-mute); font-size:14px; margin-bottom:18px}
.tl-grid{display:grid; grid-template-columns:140px 1fr 130px; gap:0}
.tl-row{display:contents}
.tl-row > *{padding:11px 12px; border-top:1px solid var(--line-soft)}
.tl-row:first-child > *{border-top:0}
.tl-stage{font-weight:600; color:var(--accent); font-size:13.5px}
.tl-stage.s2{color:var(--primary)}
.tl-stage.prep{color:var(--ink-mute)}
.tl-stage.open{color:var(--success); font-weight:700}
.tl-task{font-size:14px}
.tl-date{font-size:13px; color:var(--ink-soft); text-align:right; font-variant-numeric:tabular-nums}
.tl-row.highlight .tl-task,.tl-row.highlight .tl-date{font-weight:700; color:var(--ink)}
.tl-row.highlight .tl-stage{color:var(--accent)}

/* ═══════════════════════════════════════════════════
   Club listing
   ═══════════════════════════════════════════════════ */
.toolbar{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:14px 16px; background:#fff; border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow-sm); margin-bottom:18px;
  position:sticky; top:71px; z-index:30;
}
.search{flex:1; min-width:220px; position:relative}
.search input{
  width:100%; padding:10px 14px 10px 38px; border-radius:9px;
  border:1px solid var(--line); background:var(--bg);
  outline:none; transition:border-color .15s, background .15s;
}
.search input:focus{border-color:var(--primary); background:#fff}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-mute)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  padding:7px 14px; border-radius:999px; font-size:13px;
  background:var(--line-soft); color:var(--ink-soft); font-weight:500;
  transition:all .12s;
}
.chip:hover{background:#e7eaf0}
.chip.active{background:var(--primary); color:#fff}

.club-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px}
.club{
  background:#fff; border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px 18px 16px; display:flex; flex-direction:column; gap:10px;
  transition:box-shadow .15s, transform .15s, border-color .15s;
  position:relative;
}
.club:hover{box-shadow:var(--shadow); border-color:#dde2ea}
.club .head{display:flex; align-items:flex-start; gap:10px}
.club .name{font-weight:700; font-size:16.5px; flex:1; line-height:1.4}
.club .price{font-weight:700; color:var(--primary); font-size:18px; font-variant-numeric:tabular-nums}
.club .price .unit{font-size:12px; font-weight:400; color:var(--ink-mute); margin-left:2px}
.club .meta{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13.5px; color:var(--ink-soft)}
.club .meta .lbl{color:var(--ink-mute); white-space:nowrap}
.club .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:auto}
.club .note{font-size:12.5px; color:var(--ink-mute); padding-top:8px; border-top:1px dashed var(--line); line-height:1.55}
.club .footer{display:flex; align-items:center; gap:10px; margin-top:6px}
.spots{display:flex; align-items:center; gap:8px; flex:1; font-size:13px; color:var(--ink-soft)}
.spots .bar{flex:1; height:6px; background:var(--line-soft); border-radius:999px; overflow:hidden}
.spots .bar i{display:block; height:100%; background:var(--success); border-radius:999px}
.spots.warn .bar i{background:var(--warn)}
.spots.full .bar i{background:var(--danger)}

.empty{text-align:center; padding:60px 20px; color:var(--ink-mute)}
.empty .ico{font-size:38px; margin-bottom:10px}

/* Steps indicator */
.steps{display:flex; gap:0; align-items:center; margin-bottom:22px}
.step{display:flex; align-items:center; gap:9px; flex:1}
.step .num{
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  background:var(--line); color:var(--ink-mute); font-weight:700; font-size:13px;
  flex-shrink:0;
}
.step.active .num{background:var(--primary); color:#fff}
.step.done .num{background:var(--success); color:#fff}
.step .lbl{font-size:14px; color:var(--ink-mute); font-weight:500}
.step.active .lbl,.step.done .lbl{color:var(--ink)}
.step .line{flex:1; height:2px; background:var(--line); margin:0 4px}
.step.done .line{background:var(--success)}

/* Form */
.form-card{padding:28px 30px}
.warn-box{
  background:var(--accent-soft); border:1px solid #f5b483;
  color:#7c3a0e; border-radius:var(--r); padding:14px 16px;
  display:flex; gap:12px; margin-bottom:22px;
}
.warn-box .ico{font-size:22px; flex-shrink:0; line-height:1.1}
.warn-box strong{color:var(--accent)}
.fset{margin-bottom:22px}
.fset > h4{margin:0 0 12px; font-size:14px; font-weight:700; color:var(--primary); letter-spacing:.04em}
.frow{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.field{display:flex; flex-direction:column; gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13.5px; font-weight:500}
.field label .req{color:var(--accent); margin-left:3px}
.field .hint{font-size:12px; color:var(--ink-mute)}
.field input,.field select{
  padding:10px 12px; border:1px solid var(--line); border-radius:9px;
  background:#fff; outline:none; transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus{
  border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,95,168,.12);
}
.field.bad input,.field.bad select{border-color:var(--danger)}
.field .err{font-size:12px; color:var(--danger)}
.checks{display:flex; flex-direction:column; gap:10px}
.check{display:flex; gap:10px; padding:12px 14px; background:var(--bg); border:1px solid var(--line); border-radius:10px; cursor:pointer}
.check input{margin-top:3px}
.check span{font-size:13.5px; line-height:1.5}
.form-actions{display:flex; justify-content:space-between; gap:10px; margin-top:24px; padding-top:20px; border-top:1px solid var(--line)}

/* Confirm */
.summary{padding:28px 30px}
.summary .grp{display:grid; grid-template-columns:130px 1fr; gap:8px 20px; margin:14px 0}
.summary .grp .k{color:var(--ink-mute); font-size:13.5px}
.summary .grp .v{font-weight:500}
.summary h3{margin:0 0 6px; font-size:18px}
.terms{
  background:var(--bg); border-left:3px solid var(--primary);
  padding:14px 18px; border-radius:8px; margin:18px 0;
  font-size:13px; color:var(--ink-soft); line-height:1.7;
}
.terms b{color:var(--ink)}
.terms ol{margin:6px 0 0; padding-left:18px}
.fee-line{display:flex; justify-content:space-between; padding:6px 0; font-size:14px}
.fee-line.total{border-top:1px solid var(--line); margin-top:6px; padding-top:12px; font-size:18px; font-weight:700; color:var(--primary)}

/* Done */
.done-card{padding:48px 32px; text-align:center}
.done-icon{
  width:84px; height:84px; border-radius:50%; background:var(--success-soft);
  color:var(--success); display:grid; place-items:center; margin:0 auto 18px;
  font-size:42px;
}
.done-card h2{margin:0 0 6px; font-size:24px}
.done-card .reg-id{
  font-family:"SF Mono",Menlo,monospace; font-size:24px; font-weight:700; color:var(--primary);
  background:var(--primary-soft); padding:10px 20px; border-radius:10px;
  display:inline-block; margin:8px 0 18px; letter-spacing:.05em;
}
.done-card .next{color:var(--ink-soft); font-size:14px; max-width:480px; margin:0 auto 20px}
.notice-card{
  background:var(--warn-soft); border-left:4px solid var(--warn);
  padding:14px 18px; border-radius:8px; text-align:left;
  margin:14px auto; max-width:520px; font-size:13.5px; color:#6b4a17;
}

/* ═══════════════════════════════════════════════════
   Admin
   ═══════════════════════════════════════════════════ */
.admin-shell{display:grid; grid-template-columns:240px 1fr; gap:0; min-height:calc(100vh - 70px)}
.admin-side{
  background:#fff; border-right:1px solid var(--line); padding:18px 14px;
  position:sticky; top:71px; height:calc(100vh - 71px); overflow:auto;
}
.admin-side .title{font-size:13px; font-weight:700; color:var(--ink-mute); padding:0 8px 8px; letter-spacing:.05em}
.admin-side a{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:8px; font-size:14px;
  color:var(--ink-soft); cursor:pointer; margin-bottom:2px;
}
.admin-side a:hover{background:var(--line-soft); color:var(--ink)}
.admin-side a.active{background:var(--primary-soft); color:var(--primary); font-weight:600}
.admin-main{padding:24px 28px 60px; background:var(--bg); overflow:auto}
.admin-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px}
.admin-head h2{margin:0; font-size:22px}

.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
.kpi{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.kpi .lbl{font-size:13px; color:var(--ink-mute)}
.kpi .val{font-size:28px; font-weight:700; color:var(--primary); font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px; color:var(--ink-mute); margin-top:2px}

.chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.chart-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px}
.chart-card h3{margin:0 0 12px; font-size:15px; font-weight:600}
.chart-card.full{grid-column:1/-1}
.chart-card canvas{max-height:300px}

.table-wrap{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.table-wrap .table-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.tbl{width:100%; border-collapse:collapse; font-size:14px}
.tbl th{background:var(--bg); padding:10px 14px; text-align:left; font-weight:600; color:var(--ink-soft); border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:10px 14px; border-bottom:1px solid var(--line-soft)}
.tbl tr:hover td{background:var(--primary-tint)}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums}
.tbl .badge{padding:2px 8px; border-radius:999px; font-size:12px}
.tbl .badge.pending{background:var(--warn-soft); color:var(--warn)}
.tbl .badge.paid{background:var(--success-soft); color:var(--success)}

/* Modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(15,23,42,.5);
  display:none; align-items:center; justify-content:center; z-index:200;
  backdrop-filter:blur(2px);
}
.modal-bg.show{display:flex}
.modal{background:#fff; border-radius:16px; padding:28px 30px; width:min(420px,90vw); box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 6px; font-size:20px}
.modal p{color:var(--ink-mute); margin:0 0 18px; font-size:14px}

/* Print sheets */
.print-sheet{display:none}
.print-only{display:none}

/* ═══════════════════════════════════════════════════
   Print
   ═══════════════════════════════════════════════════ */
@media print{
  body{background:#fff}
  .topbar,.toolbar,.steps,.no-print,.admin-side,.admin-head,.kpi-row,.chart-grid{display:none !important}
  .container,.admin-main{padding:0; max-width:none}
  .print-only{display:block}
  .print-sheet{display:block; page-break-after:always}
  .print-sheet:last-child{page-break-after:auto}
  @page{size:A4 portrait; margin:15mm}
  @page roster{size:A4 landscape; margin:14mm}
  @page notice{size:A4 portrait; margin:15mm}

  .roster-sheet{page:roster}
  .roster-sheet table{width:100%; border-collapse:collapse; font-size:10.5px}
  .roster-sheet th,.roster-sheet td{border:1px solid #666; padding:5px 4px; text-align:center}
  .roster-sheet th{background:#1a5fa8; color:#fff; font-weight:600; font-size:10px; padding:6px 4px}
  .roster-sheet td{background:#fff}
  .roster-sheet tbody tr:nth-child(even) td{background:#f8f9fa}
  .roster-sheet tbody td:first-child{background:#1a5fa8; font-weight:600; color:#fff}
  .roster-sheet h1{font-size:16px; margin:0 0 8px; text-align:center; font-weight:700; color:#1a5fa8}

  .roster-sheet .info b{color:#1a5fa8}
  .roster-sheet .foot{font-size:11px; margin-top:10px; display:flex; justify-content:space-between; padding-top:8px; border-top:2px solid #1a5fa8}
  .roster-sheet thead{display:table-header-group}
  .roster-sheet .roster-header{page-break-inside:avoid}

  .notice-sheet{page:notice}
  .notice-slip{
    border:2px solid var(--primary); border-radius:6px; padding:12mm 14mm;
    page-break-inside:avoid; font-size:12.5px;
  }
  .notice-slip h2{margin:0 0 6px; font-size:15px; text-align:center; color:var(--primary)}
  .notice-slip .sub{text-align:center; font-size:13px; margin-bottom:10px}
  .notice-slip .row{display:grid; grid-template-columns:80px 1fr; gap:3px 8px; font-size:12px; line-height:1.7}
  .notice-slip .row .l{color:#555}
  .notice-slip .warn{font-size:11px; margin-top:8px; padding-top:6px; border-top:1px dashed #999; line-height:1.6}

@media screen{
  .print-only{display:none !important}
}

  .entries{grid-template-columns:1fr; gap:12px}

/* ── Remote backend (Google Apps Script) ────────────────────── */
async function postRemoteReg(reg){
  if (!API_URL) return { ok:false, skipped:true };
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(reg),
    });
    const data = await res.json();
    return data;
  } catch(e){
    console.error("remote save failed", e);
    return { ok:false, error:String(e) };
  }
}
async function fetchRemoteRegs(){
  if (!API_URL) return null;
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP "+res.status);
    const arr = await res.json();
    return Array.isArray(arr) ? arr : null;
  } catch(e){
    console.error("remote load failed", e);
    return null;
  }
}
async function deleteRemoteReg(id, clubId){
  if (!API_URL) return { ok:true, skipped:true };
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"delete", id, clubId }),
    });
    return await res.json();
  } catch(e){
    console.error("remote delete failed", e);
    return { ok:false, error:String(e) };
  }
}

  if (state.view === "admin") return renderAdmin();

  if (state.filterDay !== "全部") {
    list = list.filter(c => cat.showDay ? c.day===state.filterDay : c.time.startsWith(state.filterDay));
  }
  if (state.filterType !== "all") list = list.filter(c => c.type===state.filterType);
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    list = list.filter(c => (c.name+c.teacher+c.location).toLowerCase().includes(q));
  }
  if (!list.length){
    grid.innerHTML = `<div class="empty"><div class="ico">🔍</div>找不到符合條件的社團，請調整篩選。</div>`;
    return;
  }
  grid.innerHTML = `<div class="club-grid">${list.map(c=>{
    const taken = spotsTaken(c.id);
    const remain = Math.max(0, c.spots - taken);
    const pct = Math.min(100, Math.round(taken/c.spots*100));
    const full = remain<=0;
    const stat = full?"full": (remain<=3?"warn":"");
    return `
    <article class="club ${full?"full":""}">
      <div class="head">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="price">${fmt$(c.total)}</div>
      </div>
      <div class="meta">
        ${cat.showDay ? `<span class="lbl">時間</span><span>${c.day} ${c.time}</span>`
                     : `<span class="lbl">時段</span><span>${c.time}</span>`}
        <span class="lbl">教師</span><span>${escapeHtml(c.teacher)}</span>
        <span class="lbl">地點</span><span>${escapeHtml(c.location)}</span>
        <span class="lbl">招收</span><span>${escapeHtml(c.grade)}</span>
      </div>
      <div class="tags">
        ${c.isNew?'<span class="tag new">新增</span>':""}
        ${full?'<span class="tag full">額滿</span>':""}
      </div>
      ${c.note?`<div class="note">${escapeHtml(c.note)}</div>`:""}
      <div class="footer">
        <div class="spots ${stat}">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span>${taken}/${c.spots}</span>
        </div>
        <button class="btn btn-sm" disabled style="cursor:not-allowed; opacity:.5">報名截止</button>
      </div>
    </article>`;
  }).join("")}</div>`;
  $$("[data-pick]").forEach(b=>b.addEventListener("click", e=>{
    const club = findClub(e.currentTarget.dataset.pick);
    go("form", { selectedClub:club, formData:{} });
  }));
}

function afterConfirm(){
  $("#back2form").onclick = ()=>go("form");
  $("#submitFinal").onclick = async ()=>{
    const btn = $("#submitFinal");
    const club = state.selectedClub;
    const f = state.formData;
    // Re-sync registrations with the sheet so concurrent submissions don't slip past.
    btn.disabled = true; btn.textContent = "檢查中…";
    const fresh = await fetchRemoteRegs();
    btn.disabled = false; btn.textContent = "✓ 確認送出報名";
    if (!fresh){
      alert("無法連線伺服器，請檢查網路後重試。");
      return;
    }
    state.registrations = fresh; saveRegs();
    // duplicate-time conflict check (single category only)
    const dupTime = state.registrations.find(r=>{
      if (r.classNo!==f.classNo || r.seatNo!==f.seatNo || r.studentName!==f.studentName) return false;
      const c2 = findClub(r.clubId);
      if (!c2) return false;
      if (c2.id===club.id) return true;
      // same category + same day/time slot
      if (r.category===state.category){
        if (CATEGORIES[state.category].showDay){
          return c2.day===club.day && c2.time===club.time;
        } else {
          return c2.time===club.time;
        }
      }
      return false;
    });
    if (dupTime){
      if (dupTime.clubId===club.id){
        alert("此學生已報名同一社團，無法重複報名！");
        return;
      } else {
        alert(`此學生已報名同一時段的另一社團（${findClub(dupTime.clubId)?.name}），請先至「我的報名」刪除該報名，才能報名此社團。`);
        return;
      }
    }
    const reg = {
      id: nextRegId(state.category),
      category: state.category,
      clubId: club.id, clubName: club.name,
      classNo: f.classNo, seatNo: f.seatNo, studentName: f.studentName,
      contactName: f.contactName, contactPhone: f.contactPhone, email: f.email,
      totalFee: club.total, agreedTerms:true,
      timestamp: new Date().toISOString(), status:"pending",
    };
    // Remote save
    if (API_URL){
      btn.disabled = true; btn.textContent = "送出中…";
      const result = await postRemoteReg(reg);
      btn.disabled = false; btn.textContent = "✓ 確認送出報名";
      if (!result.ok){
        alert("送出失敗，請檢查網路後重試。\n" + (result.error||""));
        return;
      }
    }
    state.registrations.push(reg);
    saveRegs();
    state.myReg = reg;
    go("done");
  };
}

      saveRegs();
      runSearch();

/* steps */
function stepsHtml(active){
  const list = [["1","選擇社團"],["2","填寫資料"],["3","確認報名"],["4","完成"]];
  return `<div class="steps">${list.map(([n,l],i)=>{
    const cls = (i+1<active)?"done":(i+1===active?"active":"");
    return `<div class="step ${cls}"><div class="num">${cls==="done"?"✓":n}</div><div class="lbl">${l}</div>${i<3?'<div class="line"></div>':""}</div>`;
  }).join("")}</div>`;
}

          <h2>${ADMIN_TABS.find(t=>t.k===state.adminTab).label.replace(/^[^\s]+\s/,'')}</h2>
          <div class="muted">雙蓮國小 ・ 115學年度上學期 ・ 後台管理系統</div>
        </div>
        <div id="adminBody"></div>
      </section>
    </div>`;
  $$(".admin-side a[data-tab]").forEach(a=>a.onclick=()=>{ state.adminTab=a.dataset.tab; renderAdmin(); });
  $("#adminExit").onclick = ()=>{ state.isAdmin=false; go("home"); };
  const body = $("#adminBody");
  switch(state.adminTab){
    case "dashboard": renderDashboard(body); break;
    case "regs":      renderRegs(body); break;
    case "roster":    renderRoster(body); break;
    case "notice":    renderNotice(body); break;
    case "summary":   renderSummary(body); break;
    case "payment":   renderPayment(body); break;
    case "settings":  renderSettings(body); break;
  }
}

function renderDashboard(body){
  const all = state.registrations;
  const totalRevenue = all.reduce((s,r)=>s+r.totalFee, 0);
  const paidCount = all.filter(r=>r.status==="paid").length;
  const uniqStudents = new Set(all.map(r=>`${r.classNo}-${r.seatNo}-${r.studentName}`)).size;
  body.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">總報名筆數</div><div class="val">${all.length}</div><div class="sub">含三類社團</div></div>
      <div class="kpi"><div class="lbl">不重複學生</div><div class="val">${uniqStudents}</div><div class="sub">已參與報名</div></div>
      <div class="kpi"><div class="lbl">已繳費</div><div class="val">${paidCount}</div><div class="sub">/ ${all.length} 筆</div></div>
      <div class="kpi"><div class="lbl">應收金額</div><div class="val">${(totalRevenue/1000).toFixed(1)}k</div><div class="sub">${fmt$(totalRevenue)}</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-card full"><h3>各社團報名人數 vs 名額</h3><canvas id="ch1"></canvas></div>
      <div class="chart-card"><h3>各星期報名人數分佈</h3><canvas id="ch2"></canvas></div>
      <div class="chart-card"><h3>每日新增報名</h3><canvas id="ch3"></canvas></div>
    </div>`;
  // ── chart 1: stacked horizontal bar (taken vs remain) for each 115 club
  const ctx1 = $("#ch1").getContext("2d");
  const labels = clubs_115.map(c=>c.name);
  const taken = clubs_115.map(c=>spotsTaken(c.id));
  const remain = clubs_115.map((c,i)=>Math.max(0,c.spots-taken[i]));
  new Chart(ctx1, {
    type:"bar",
    data:{ labels, datasets:[
      { label:"已報名", data:taken, backgroundColor:"#1a5fa8", stack:"a" },
      { label:"剩餘名額", data:remain, backgroundColor:"#cfd8e3", stack:"a" },
    ]},
    options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false,
      scales:{ x:{stacked:true, ticks:{font:{size:11}}}, y:{stacked:true, ticks:{font:{size:10}}} },
      plugins:{ legend:{position:"bottom"} }
    },
  });
  $("#ch1").parentElement.style.height = "560px";
  // ── chart 2: pie by day
  const days = ["週一","週二","週三","週四","週五"];
  const dayCounts = days.map(d => state.registrations.filter(r=>{ const c=findClub(r.clubId); return c && c.day===d; }).length);
  new Chart($("#ch2"), {
    type:"doughnut",
    data:{ labels:days, datasets:[{ data:dayCounts, backgroundColor:["#1a5fa8","#3a8bd8","#7c5dc8","#e05c2a","#1e8a5e"] }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:"bottom"} } },
  });
  // ── chart 3: line by date
  const byDate = {};
  all.forEach(r=>{
    const d = r.timestamp.slice(5,10);
    byDate[d] = (byDate[d]||0)+1;
  });
  const ds = Object.keys(byDate).sort();
  new Chart($("#ch3"), {
    type:"line",
    data:{ labels:ds, datasets:[{ label:"新增報名", data:ds.map(d=>byDate[d]), borderColor:"#1a5fa8", backgroundColor:"rgba(26,95,168,.15)", fill:true, tension:.3 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} } },
  });
}

function renderRegs(body){

        <div>
          <div style="font-weight:600">所有報名資料</div>
          <div class="muted" style="font-size:12.5px">共 ${state.registrations.length} 筆</div>

            ${Object.entries(CATEGORIES).filter(([k,c])=>!c.disabled).map(([k,c])=>`<option value="${k}">${c.title}</option>`).join("")}
          </select>
          <input id="rg-q" placeholder="搜尋姓名/班級/社團" class="btn btn-sm" style="padding:6px 10px; min-width:200px; text-align:left">
          <button class="btn btn-sm" id="rg-csv">匯出 CSV</button>
        </div>
      </div>
      <div style="max-height:60vh; overflow:auto">
        <table class="tbl" id="rg-tbl">
          <thead><tr>
            <th>報名編號</th><th>類別</th><th>班級</th><th>座號</th><th>姓名</th><th>社團</th><th>時間</th>
            <th class="num">費用</th><th>聯絡人</th><th>電話</th><th>Email</th><th>狀態</th><th>動作</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>`;
  function refresh(){
    const cat = $("#rg-cat").value;
    const q = $("#rg-q").value.trim().toLowerCase();
    const rows = state.registrations.filter(r =>
      (!cat || r.category===cat) &&
      (!q || (r.studentName+r.classNo+r.clubName+r.contactName).toLowerCase().includes(q))
    ).sort((a,b)=> String(a.classNo).localeCompare(String(b.classNo)) || String(a.seatNo).localeCompare(String(b.seatNo)));
    $("#rg-tbl tbody").innerHTML = rows.map(r=>{
      const c = findClub(r.clubId);
      return `<tr>
        <td><code>${r.id}</code></td>
        <td>${CATEGORIES[r.category].emoji} ${CATEGORIES[r.category].title.replace("社團","").replace(" ","")}</td>
        <td>${escapeHtml(r.classNo)}</td>
        <td>${escapeHtml(r.seatNo)}</td>
        <td>${escapeHtml(r.studentName)}</td>
        <td>${escapeHtml(r.clubName)}</td>
        <td>${c?(c.day||"")+" "+c.time:""}</td>
        <td class="num">${fmt$(r.totalFee)}</td>
        <td>${escapeHtml(r.contactName)}</td>
        <td>${escapeHtml(r.contactPhone)}</td>
        <td>${escapeHtml(r.email||"")}</td>
        <td><span class="badge ${r.status==='paid'?'paid':'pending'}">${r.status==='paid'?'已繳費':'待繳費'}</span></td>
        <td>
          <button class="btn btn-sm" data-toggle="${r.id}">${r.status==='paid'?'設待繳':'設已繳'}</button>
          <button class="btn btn-sm" data-del="${r.id}" style="color:var(--danger)">刪除</button>
        </td>
      </tr>`;
    }).join("");
    $$("[data-toggle]").forEach(b=>b.onclick=e=>{
      const id=e.currentTarget.dataset.toggle;
      const r=state.registrations.find(x=>x.id===id); r.status = r.status==="paid"?"pending":"paid";
      saveRegs(); refresh();
    });
    $$("[data-del]").forEach(b=>b.onclick=e=>{
      const id=e.currentTarget.dataset.del;
      if (!confirm("確定刪除此報名紀錄？")) return;
      state.registrations = state.registrations.filter(x=>x.id!==id);
      saveRegs(); refresh();
    });
  }
  $("#rg-cat").onchange = refresh;
  $("#rg-q").oninput = refresh;
  $("#rg-csv").onclick = ()=>{
    const head = ["報名編號","類別","班級","座號","姓名","社團","時間","費用","聯絡人","電話","Email","狀態","報名時間"];
    const lines = [head.join(",")];
    state.registrations.forEach(r=>{
      const c = findClub(r.clubId);
      lines.push([r.id, CATEGORIES[r.category].title, r.classNo, r.seatNo, r.studentName, r.clubName, c?(c.day||"")+" "+c.time:"", r.totalFee, r.contactName, r.contactPhone, r.email||"", r.status, r.timestamp].map(s=>`"${String(s||"").replace(/"/g,'""')}"`).join(","));
    });
    downloadFile("報名名單.csv", "\ufeff"+lines.join("\n"), "text/csv");
  };
  refresh();
}

function renderRoster(body){
  body.innerHTML = `
    <div class="card" style="padding:24px 28px">
      <h3 style="margin-top:0">各社團點名表列印</h3>
      <p class="muted">A4 橫式，一個社團一張，列出該社團所有報名學生。</p>
      <div style="display:flex; gap:10px; margin-top:18px; align-items:center">
        <select id="rs-club" class="btn btn-sm" style="padding:6px 10px; min-width:280px">
          <option value="all">全部社團一次列印</option>
          ${clubs_115.map(c=>`<option value="${c.id}">${c.day} ${c.time} ・ ${c.name}（${spotsTaken(c.id)}人）</option>`).join("")}
        </select>
        <button class="btn btn-sm" id="rs-preview">預覽</button>
        <button class="btn btn-primary btn-sm" id="rs-print">🖨 列印 / 存 PDF</button>
      </div>
      
      <div class="divider"></div>
      <h4 style="margin:0 0 8px">預覽</h4>
      <div id="rs-preview-area" style="max-height:60vh; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#f5f5f5; padding:20px"></div>
    </div>`;
  
  function buildSheet(clubId){
    const clubIds = clubId === "all" ? clubs_115.map(c=>c.id) : [clubId];
    
    return clubIds.map(cid=>{
      const c = findClub(cid);
      if (!c) return "";
      
      const rows = state.registrations
        .filter(r=>r.clubId===cid)
        .sort((a,b)=> String(a.classNo).localeCompare(String(b.classNo)) || String(a.seatNo).localeCompare(String(b.seatNo)));
      
      const sessions = (CLASS_START[c.day]||[]).slice(0, c.sessions);
      
      // 根據上課次數調整欄位寬度
      let fixedCols = {seq: 3, class: 5, seat: 4, name: 8, contact: 8, note: 6}; // 總34%
      let dateWidth = (100 - 34) / c.sessions; // 剩餘66%平均分配給日期
      
      // 如果日期欄位太窄（<3%），壓縮固定欄位
      if (dateWidth < 3) {
        fixedCols = {seq: 2.5, class: 4, seat: 3.5, name: 7, contact: 7, note: 5}; // 總29%
        dateWidth = (100 - 29) / c.sessions;
      }
      
      const sessHead = sessions.map((d)=>`<th style="width:${dateWidth.toFixed(1)}%; font-size:${dateWidth < 3.5 ? '8px' : '9px'}">${d}</th>`).join("");
      const sessCell = sessions.map(()=>`<td></td>`).join("");
      
      // 加入空白列到滿額
      const allRows = [...rows, ...Array.from({length: Math.max(0, c.spots-rows.length)}).map((_,i)=>({empty:true, seq:rows.length+i+1}))];
      
      // 每頁最多 25 列（含標題）
      const rowsPerPage = 25;
      const pages = [];
      for (let i = 0; i < allRows.length; i += rowsPerPage) {
        pages.push(allRows.slice(i, i + rowsPerPage));
      }
      
      // 生成每一頁
      return pages.map((pageRows, pageIdx) => `
        <div class="roster-sheet print-sheet" style="background:#fff; padding:14mm 12mm; margin-bottom:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); page-break-after:always">
          <h1>臺北市雙蓮國小　115學年度上學期　社團點名表</h1>
          <div class="info">
            <div><b>社團名稱：</b>${escapeHtml(c.name)}</div>
            <div><b>授課教師：</b>${escapeHtml(c.teacher)}</div>
            <div><b>上課時間：</b>${c.day} ${c.time}</div>
            <div><b>上課地點：</b>${escapeHtml(c.location)}</div>
            <div><b>開始日期：</b>${sessions[0]||"待定"}</div>
            <div><b>上課次數：</b>共 ${c.sessions} 次</div>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width:${fixedCols.seq}%">序</th>
                <th style="width:${fixedCols.class}%">班級</th>
                <th style="width:${fixedCols.seat}%">座號</th>
                <th style="width:${fixedCols.name}%">姓名</th>
                <th style="width:${fixedCols.contact}%">聯絡人</th>
                ${sessHead}
                <th style="width:${fixedCols.note}%">備註</th>
              </tr>
            </thead>
            <tbody>
              ${pageRows.map(r => r.empty ? `<tr>
                <td>${r.seq}</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                ${sessCell}
                <td></td>
              </tr>` : `<tr>
                <td>${rows.indexOf(r)+1}</td>
                <td>${escapeHtml(r.classNo)}</td>
                <td>${escapeHtml(r.seatNo)}</td>
                <td style="text-align:left; padding-left:8px">${escapeHtml(r.studentName)}</td>
                <td style="text-align:left; padding-left:6px; font-size:9px">${escapeHtml(r.contactName||'')}<br>${escapeHtml(r.contactPhone||'')}</td>
                ${sessCell}
                <td></td>
              </tr>`).join("")}
            </tbody>
          </table>
          <div class="foot"><div>共 ${rows.length} 人${pages.length > 1 ? ` （第 ${pageIdx+1}/${pages.length} 頁）` : ''}</div><div>列印日期：____ 年 __ 月 __ 日</div></div>
        </div>`).join("");
    }).join("");
  }
  
  $("#rs-preview").onclick = ()=>{ $("#rs-preview-area").innerHTML = buildSheet($("#rs-club").value); };
  $("#rs-print").onclick = ()=>{
    $("#printRegion").innerHTML = buildSheet($("#rs-club").value);
    setTimeout(()=>window.print(), 100);
  };
  $("#rs-preview-area").innerHTML = buildSheet("all");
}

      studentMap.get(key).clubs.push(findClub(r.clubId));

      String(a.classNo).localeCompare(String(b.classNo)) || String(a.seatNo).localeCompare(String(b.seatNo))
    );

            <ol style="margin:0; padding-left:14px; line-height:1.4; font-size:${fontSize.content}px">

              <li>為了學生的安全，社團課結束後請家長準時至大門口接學生，請勿讓學生自行提前返家。</li>
              <li>本校社團課程無集體下課時段，教師將視課程及學生現況，安排休息、喝水上廁所活動。</li>

          </div>
          
          <div style="text-align:center; margin-top:6px; padding-top:6px; border-top:1px solid #ddd; font-size:${fontSize.contact}px; color:#666; line-height:1.4">
            如有問題請洽雙蓮國小學務處訓育組 羅老師 Tel：02-25570309 轉 1022
          </div>
        </div>`;
    }).join("");
    return slips;
  }
  $("#nt-cat").onchange = ()=>{ $("#nt-preview-area").innerHTML = buildNotice($("#nt-cat").value); };
  $("#nt-print").onclick = ()=>{
    $("#printRegion").innerHTML = buildNotice($("#nt-cat").value);
    setTimeout(()=>window.print(), 100);
  };

      return cat === category;
    });

      const c = findClub(r.clubId);
      return {
        classNo: r.classNo,
        seatNo: r.seatNo,
        studentName: r.studentName,

        time: c ? (c.day || "") + " " + c.time : "",
        location: c ? c.location : ""
      };
    }).sort((a, b) => {
      return String(a.classNo).localeCompare(String(b.classNo)) || 
             String(a.seatNo).localeCompare(String(b.seatNo));

    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws["!merges"] = [{ s: {r:0, c:0}, e: {r:0, c:headers.length-1} }];
    const wb = XLSX.utils.book_new();

    XLSX.writeFile(wb, `雙蓮國小_${title}_學生一覽.xlsx`);
  }
  
  $("#sm-115").onclick = () => exportByCategory("115", "115上學期社團");

      const s = String(id || "");
      if (s.startsWith("SUM")) return "暑假";
      if (s.startsWith("G1")) return "小一";
      return "115上";
    };
    return {
      category: inferCat(r.clubId),
      classNo: r.classNo,
      seatNo: r.seatNo,
      studentName: r.studentName,
      clubName: r.clubName,
      time: c ? (c.day || "") + " " + c.time : "",
      location: c ? c.location : ""
    };
  }).sort((a, b) => {
    return a.category.localeCompare(b.category) ||
           String(a.classNo).localeCompare(String(b.classNo)) || 
           String(a.seatNo).localeCompare(String(b.seatNo));
  });
  
  $("#sm-preview").innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th>類別</th><th>班級</th><th>座號</th><th>姓名</th><th>社團</th><th>時間</th><th>上課地點</th>

          <td>${escapeHtml(row.time)}</td>

        </tr>`).join("")}

}

function buildPaymentGrid(category){
  const inferCat = (id)=>{
    const s = String(id||"");
    if (s.startsWith("SUM")) return "summer";
    if (s.startsWith("G1"))  return "grade1";
    return "115";
  };
  let pool = state.registrations.slice().map(r => ({
    ...r,
    category: (r.category && String(r.category).trim()) || inferCat(r.clubId),
  }));
  let clubList;
  if (category==="all") clubList = allClubs();
  else { pool = pool.filter(r=>r.category===category); clubList = CATEGORIES[category].data; }
  const presentClubs = clubList.filter(c => pool.some(r=>r.clubId===c.id));
  // group by student
  const byStudent = {};
  pool.forEach(r=>{ const k=`${r.classNo}|${r.seatNo}|${r.studentName}`; (byStudent[k] ||= []).push(r); });
  const stus = Object.values(byStudent).sort((a,b)=>{
    const A=a[0],B=b[0]; return String(A.classNo).localeCompare(String(B.classNo)) || String(A.seatNo).localeCompare(String(B.seatNo));
  });
  const head = ["序號","班級","座號","姓名", "合計", ...presentClubs.map(c=>c.name)];
  const rows = stus.map((stu,i)=>{
    const r = stu[0];
    const map = {}; stu.forEach(x=>map[x.clubId]=x.totalFee);
    const fees = presentClubs.map(c => map[c.id] || "");
    const total = stu.reduce((s,x)=>s+x.totalFee,0);
    return [i+1, r.classNo, r.seatNo, r.studentName, total, ...fees];
  });
  return { head, rows, clubs:presentClubs };
}

async function exportPayment(category, btn){
  const titleMap = { 
    "115":"預算 (115 學年度)", 
    "summer":"預算 (暑假社團)", 
    "phase1":"預算 (第一階段)",
    "phase2":"預算 (第二階段)",
    "grade1":"預算 (小一社團)", 
    "all":"預算 (全部社團)" 
  };
  const title = titleMap[category];

  const origText = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = "產生中…"; }
  try {
    // 使用本地資料產生 Excel
    const inferCat = (id)=>{
      const s = String(id||"");
      if (s.startsWith("SUM")) return "summer";
      if (s.startsWith("G1"))  return "grade1";
      return "115";
    };
    // 補上類別（舊資料 category 欄可能為空，與預覽 buildPaymentGrid 一致）
    let regs = state.registrations.map(r => ({
      ...r,
      category: (r.category && String(r.category).trim()) || inferCat(r.clubId),
    }));

    // 根據類別篩選
    if (category === "phase1") {
      // 第一階段：115上學期 + 暑假，且報名時間在第二階段開始（6/20）之前
      const phase2Start = new Date('2026-06-20');
      regs = regs.filter(r => {
        const regDate = new Date(r.timestamp);
        return (r.category === "115" || r.category === "summer") && regDate < phase2Start;
      });
    } else if (category === "phase2") {
      // 第二階段：只有115上學期，且報名時間在 6/20-6/22
      const phase2Start = new Date('2026-06-20');
      const phase2End = new Date('2026-06-23');
      regs = regs.filter(r => {
        const regDate = new Date(r.timestamp);
        return r.category === "115" && regDate >= phase2Start && regDate < phase2End;
      });
    } else if (category !== "all") {
      regs = regs.filter(r => r.category === category);
    }
    
    // 取得所有社團（暑假社團加上標記）
    const clubSet = new Map(); // 使用 Map 保留類別資訊
    regs.forEach(r => {
      const clubLabel = r.category === "summer" ? `${r.clubName}(暑)` : r.clubName;
      if (!clubSet.has(clubLabel)) {
        clubSet.set(clubLabel, r.category);
      }
    });
    // 排序：115上學期在前，暑假在後
    const clubs = Array.from(clubSet.entries())
      .sort((a, b) => {
        if (a[1] === "summer" && b[1] !== "summer") return 1;
        if (a[1] !== "summer" && b[1] === "summer") return -1;
        return a[0].localeCompare(b[0]);
      })
      .map(([name]) => name);
    
    // 按學生分組
    const studentMap = new Map();
    regs.forEach(r => {
      const key = `${r.classNo}-${r.seatNo}-${r.studentName}`;
      if (!studentMap.has(key)) {
        studentMap.set(key, {
          classNo: r.classNo,
          seatNo: r.seatNo,
          studentName: r.studentName,
          clubs: {}
        });
      }
      const clubLabel = r.category === "summer" ? `${r.clubName}(暑)` : r.clubName;
      studentMap.get(key).clubs[clubLabel] = r.totalFee;
    });
    
    // 排序學生
    const students = Array.from(studentMap.values()).sort((a,b)=> 
      String(a.classNo).localeCompare(String(b.classNo)) || String(a.seatNo).localeCompare(String(b.seatNo))
    );
    
    // 建立表格資料
    const headers = ["序號", "班級", "座號", "姓名", "合計", ...clubs];
    const wsData = [
      [title],
      [],
      headers,
      ...students.map((s, idx) => {
        const total = Object.values(s.clubs).reduce((sum, v) => sum + (v || 0), 0);
        return [
          idx + 1,
          s.classNo,
          s.seatNo,
          s.studentName,
          total,
          ...clubs.map(c => s.clubs[c] || "")
        ];
      })
    ];
    
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    
    // 合併第一列標題
    ws["!merges"] = [{ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }];
    
    // 設定欄位寬度
    ws["!cols"] = [
      {wch: 6},  // 序號
      {wch: 8},  // 班級
      {wch: 6},  // 座號
      {wch: 10}, // 姓名
      {wch: 10}, // 合計
      ...clubs.map(() => ({wch: 12})) // 各社團
    ];
    
    // 設定儲存格樣式
    const headerRow = 2; // 第三列（0-indexed）
    const dataStartRow = 3;
    
    // 標題列樣式（藍底白字）
    for (let c = 0; c < headers.length; c++) {
      const cellAddr = XLSX.utils.encode_cell({r: headerRow, c});
      if (!ws[cellAddr]) continue;
      ws[cellAddr].s = {
        fill: { fgColor: { rgb: "1a5fa8" } },
        font: { color: { rgb: "FFFFFF" }, bold: true },
        alignment: { horizontal: "center", vertical: "center" },
        border: {
          top: {style: "thin", color: {rgb: "000000"}},
          bottom: {style: "thin", color: {rgb: "000000"}},
          left: {style: "thin", color: {rgb: "000000"}},
          right: {style: "thin", color: {rgb: "000000"}}
        }
      };
      // 合計欄（第5欄，index=4）使用橘底
      if (c === 4) {
        ws[cellAddr].s.fill = { fgColor: { rgb: "fce5cd" } };
        ws[cellAddr].s.font = { color: { rgb: "1f2937" }, bold: true };
      }
    }
    
    // 資料列樣式
    for (let r = dataStartRow; r < dataStartRow + students.length; r++) {
      for (let c = 0; c < headers.length; c++) {
        const cellAddr = XLSX.utils.encode_cell({r, c});
        if (!ws[cellAddr]) continue;
        
        // 基本樣式
        ws[cellAddr].s = {
          alignment: { horizontal: c < 4 ? "center" : "right", vertical: "center" },
          border: {
            top: {style: "thin", color: {rgb: "cccccc"}},
            bottom: {style: "thin", color: {rgb: "cccccc"}},
            left: {style: "thin", color: {rgb: "cccccc"}},
            right: {style: "thin", color: {rgb: "cccccc"}}
          }
        };
        
        // 合計欄（橘底加粗）
        if (c === 4) {
          ws[cellAddr].s.fill = { fgColor: { rgb: "fce5cd" } };
          ws[cellAddr].s.font = { bold: true };
          ws[cellAddr].z = "#,##0"; // 千分位格式
        }
        // 社團欄位（有報名的淡藍底）
        else if (c >= 5 && ws[cellAddr].v) {
          ws[cellAddr].s.fill = { fgColor: { rgb: "e8f0fb" } };
          ws[cellAddr].z = "#,##0"; // 千分位格式
        }
      }
    }
    
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, title.slice(0,30));
    XLSX.writeFile(wb, `雙蓮國小_${title}_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch(e){
    alert("匯出失敗：" + e.message);
    console.error(e);
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = origText; }
  }
}

          const arr = JSON.parse(r.result);
          if (!Array.isArray(arr)) throw new Error("格式錯誤");
          if (!confirm(`即將匯入 ${arr.length} 筆資料，將覆蓋現有資料，確定？`)) return;
          state.registrations = arr; saveRegs(); alert("匯入成功！"); renderAdmin();
        } catch(err){ alert("匯入失敗："+err.message); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $("#se-seed").onclick = ()=>{ if(confirm("將清空現有資料並載入示範資料，確定？")){ state.registrations=[]; seedDemo(); renderAdmin(); }};
  $("#se-clear").onclick = ()=>{ if(confirm("確定清空所有報名資料？此動作無法復原。")){ state.registrations=[]; saveRegs(); renderAdmin(); }};
}

function downloadFile(name, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
