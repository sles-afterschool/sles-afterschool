<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>臺北市雙蓮國小・社團報名系統｜115上學期暨暑期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   Design tokens
   ═══════════════════════════════════════════════════ */
:root{
  --primary:#1a5fa8;
  --primary-dark:#134777;
  --primary-soft:#e8f0fb;
  --primary-tint:#f3f7fc;
  --accent:#e05c2a;
  --accent-soft:#fce5cd;
  --success:#1e8a5e;
  --success-soft:#e0f2e9;
  --purple:#7c5dc8;
  --purple-soft:#ece6f8;
  --warn:#c97a1a;
  --warn-soft:#fff4e0;
  --danger:#c0392b;
  --ink:#1f2937;
  --ink-soft:#4b5563;
  --ink-mute:#6b7280;
  --line:#e5e7eb;
  --line-soft:#f1f3f5;
  --bg:#f7f9fc;
  --card:#ffffff;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
  --shadow:0 4px 16px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 18px 48px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg);
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none}
input,select,textarea{font-family:inherit; font-size:inherit}
a{color:inherit; text-decoration:none}

/* ═══════════════════════════════════════════════════
   Layout shells
   ═══════════════════════════════════════════════════ */
.app{min-height:100vh; display:flex; flex-direction:column}
.topbar{
  background:#fff; border-bottom:1px solid var(--line);
  padding:14px 24px;
  display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:50;
}
.topbar .crest{
  width:42px; height:42px; border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; display:grid; place-items:center;
  font-weight:900; font-size:18px;
  box-shadow:0 4px 10px rgba(26,95,168,.25);
}
.topbar .school{display:flex; flex-direction:column; line-height:1.25}
.topbar .school .name{font-weight:700; font-size:16px}
.topbar .school .sys{font-size:12px; color:var(--ink-mute)}
.topbar nav{margin-left:auto; display:flex; gap:8px; align-items:center}
.topbar nav button{
  padding:8px 14px; border-radius:8px; font-size:14px; color:var(--ink-soft);
  font-weight:500;
}
.topbar nav button:hover{background:var(--primary-soft); color:var(--primary)}
.topbar nav button.active{background:var(--primary); color:#fff}
.topbar nav .home-btn{
  display:none; padding:7px 14px; border-radius:8px; font-size:14px;
  color:var(--primary); font-weight:600; border:1px solid var(--primary-soft);
  background:var(--primary-soft);
}
.topbar nav .home-btn:hover{background:var(--primary); color:#fff; border-color:var(--primary)}
.topbar nav .gear{
  width:34px; height:34px; border-radius:8px; display:grid; place-items:center;
  color:var(--ink-mute);
}
.topbar nav .gear:hover{background:var(--line-soft); color:var(--primary)}

.container{max-width:1180px; margin:0 auto; padding:28px 24px 80px; width:100%}

/* ═══════════════════════════════════════════════════
   Buttons
   ═══════════════════════════════════════════════════ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 20px; border-radius:10px;
  font-weight:500; font-size:15px;
  background:#fff; color:var(--ink); border:1px solid var(--line);
  transition:all .15s ease;
}
.btn:hover{background:var(--line-soft); border-color:#d4d8de}
.btn-primary{background:var(--primary); color:#fff; border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark); border-color:var(--primary-dark)}
.btn-accent{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn-accent:hover{background:#c44e1f; border-color:#c44e1f}
.btn-success{background:var(--success); color:#fff; border-color:var(--success)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-lg{padding:14px 26px; font-size:16px}
.btn-sm{padding:7px 12px; font-size:13px}

/* ═══════════════════════════════════════════════════
   Cards / common
   ═══════════════════════════════════════════════════ */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm)}
.section-title{display:flex; align-items:baseline; gap:12px; margin:28px 0 16px}
.section-title h2{margin:0; font-size:22px; font-weight:700}
.section-title .sub{color:var(--ink-mute); font-size:14px}
.muted{color:var(--ink-mute)}
.tag{
  display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px;
  font-size:12px; font-weight:500; line-height:1.6;
  background:var(--line-soft); color:var(--ink-soft);
}
.tag.new{background:var(--accent-soft); color:var(--accent)}
.tag.full{background:#fde2e2; color:var(--danger)}
.tag.sport{background:#e3effb; color:var(--primary)}
.tag.art{background:var(--purple-soft); color:var(--purple)}
.divider{height:1px; background:var(--line); margin:18px 0}

/* ═══════════════════════════════════════════════════
   Landing
   ═══════════════════════════════════════════════════ */
.hero{
  background:linear-gradient(135deg,#1a5fa8 0%, #2670bd 60%, #3a8bd8 100%);
  color:#fff; border-radius:var(--r-xl); padding:36px 36px 32px;
  position:relative; overflow:hidden;
}
.hero::before{
  content:""; position:absolute; right:-80px; top:-80px;
  width:340px; height:340px; border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero::after{
  content:""; position:absolute; right:80px; bottom:-120px;
  width:240px; height:240px; border-radius:50%;
  background:rgba(255,255,255,.06);
}
.hero .eyebrow{font-size:13px; letter-spacing:.18em; opacity:.85; font-weight:500}
.hero h1{margin:8px 0 6px; font-size:34px; font-weight:900; letter-spacing:-.01em}
.hero .lede{opacity:.9; font-size:15px; max-width:580px}
.hero .meta{display:flex; gap:24px; margin-top:18px; flex-wrap:wrap; position:relative; z-index:1}
.hero .meta .it{display:flex; align-items:center; gap:8px; font-size:14px; opacity:.92}
.hero .meta .dot{width:6px; height:6px; border-radius:50%; background:#fff}

.entries{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:22px}
.entry{
  border-radius:var(--r-lg); padding:24px 22px 22px;
  border:1px solid var(--line); background:#fff;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  cursor:pointer; position:relative; overflow:hidden;
  display:flex; flex-direction:column; min-height:200px;
}
.entry:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:transparent}
.entry .badge{
  width:48px; height:48px; border-radius:14px; display:grid; place-items:center;
  font-size:24px; margin-bottom:14px;
}
.entry h3{margin:0 0 4px; font-size:19px; font-weight:700}
.entry .sub{color:var(--ink-mute); font-size:13.5px; margin-bottom:14px}
.entry .stat{display:flex; gap:10px; margin-top:auto; font-size:13px; color:var(--ink-soft)}
.entry .stat strong{color:var(--ink); font-weight:700}
.entry.blue .badge{background:var(--primary-soft); color:var(--primary)}
.entry.blue:hover{box-shadow:0 18px 40px rgba(26,95,168,.18)}
.entry.orange .badge{background:#fdebde; color:var(--accent)}
.entry.orange:hover{box-shadow:0 18px 40px rgba(224,92,42,.18)}
.entry.purple .badge{background:var(--purple-soft); color:var(--purple)}
.entry.purple:hover{box-shadow:0 18px 40px rgba(124,93,200,.18)}
.entry .arrow{position:absolute; right:18px; top:22px; color:var(--ink-mute); transition:transform .18s ease}
.entry:hover .arrow{transform:translateX(4px); color:var(--primary)}

/* Timeline */
.timeline{padding:24px 26px}
.timeline h3{margin:0 0 4px; font-size:18px}
.timeline .lede{color:var(--ink-mute); font-size:14px; margin-bottom:18px}
.tl-grid{display:grid; grid-template-columns:140px 1fr auto; gap:0}
.tl-row{display:contents}
.tl-row > *{padding:11px 12px; border-top:1px solid var(--line-soft)}
.tl-row:first-child > *{border-top:0}
.tl-stage{font-weight:600; color:var(--accent); font-size:13.5px}
.tl-stage.s2{color:var(--primary)}
.tl-stage.prep{color:var(--ink-mute)}
.tl-stage.open{color:var(--success); font-weight:700}
.tl-task{font-size:14px}
.tl-date{font-size:13px; color:var(--ink-soft); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tl-row.highlight .tl-task,.tl-row.highlight .tl-date{font-weight:700; color:var(--ink)}
.tl-row.highlight .tl-stage{color:var(--accent)}

/* ═══════════════════════════════════════════════════
   Club listing
   ═══════════════════════════════════════════════════ */
.toolbar{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:14px 16px; background:#fff; border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow-sm); margin-bottom:18px;
  position:sticky; top:71px; z-index:30;
}
.search{flex:1; min-width:220px; position:relative}
.search input{
  width:100%; padding:10px 14px 10px 38px; border-radius:9px;
  border:1px solid var(--line); background:var(--bg);
  outline:none; transition:border-color .15s, background .15s;
}
.search input:focus{border-color:var(--primary); background:#fff}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-mute)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  padding:7px 14px; border-radius:999px; font-size:13px;
  background:var(--line-soft); color:var(--ink-soft); font-weight:500;
  transition:all .12s;
}
.chip:hover{background:#e7eaf0}
.chip.active{background:var(--primary); color:#fff}

.club-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px}
.club{
  background:#fff; border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px 18px 16px; display:flex; flex-direction:column; gap:10px;
  transition:box-shadow .15s, transform .15s, border-color .15s;
  position:relative;
}
.club:hover{box-shadow:var(--shadow); border-color:#dde2ea}
.club .head{display:flex; align-items:flex-start; gap:10px}
.club .name{font-weight:700; font-size:16.5px; flex:1; line-height:1.4}
.club .price{font-weight:700; color:var(--primary); font-size:18px; font-variant-numeric:tabular-nums}
.club .price .unit{font-size:12px; font-weight:400; color:var(--ink-mute); margin-left:2px}
.club .meta{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13.5px; color:var(--ink-soft)}
.club .meta .lbl{color:var(--ink-mute); white-space:nowrap}
.club .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:auto}
.club .note{font-size:12.5px; color:var(--ink-mute); padding-top:8px; border-top:1px dashed var(--line); line-height:1.55}
.club .footer{display:flex; align-items:center; gap:10px; margin-top:6px}
.spots{display:flex; align-items:center; gap:8px; flex:1; font-size:13px; color:var(--ink-soft)}
.spots .bar{flex:1; height:6px; background:var(--line-soft); border-radius:999px; overflow:hidden}
.spots .bar i{display:block; height:100%; background:var(--success); border-radius:999px}
.spots.warn .bar i{background:var(--warn)}
.spots.full .bar i{background:var(--danger)}

.empty{text-align:center; padding:60px 20px; color:var(--ink-mute)}
.empty .ico{font-size:38px; margin-bottom:10px}

/* Steps indicator */
.steps{display:flex; gap:0; align-items:center; margin-bottom:22px}
.step{display:flex; align-items:center; gap:9px; flex:1}
.step .num{
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  background:var(--line); color:var(--ink-mute); font-weight:700; font-size:13px;
  flex-shrink:0;
}
.step.active .num{background:var(--primary); color:#fff}
.step.done .num{background:var(--success); color:#fff}
.step .lbl{font-size:14px; color:var(--ink-mute); font-weight:500}
.step.active .lbl,.step.done .lbl{color:var(--ink)}
.step .line{flex:1; height:2px; background:var(--line); margin:0 4px}
.step.done .line{background:var(--success)}

/* Form */
.form-card{padding:28px 30px}
.warn-box{
  background:var(--accent-soft); border:1px solid #f5b483;
  color:#7c3a0e; border-radius:var(--r); padding:14px 16px;
  display:flex; gap:12px; margin-bottom:22px;
}
.warn-box .ico{font-size:22px; flex-shrink:0; line-height:1.1}
.warn-box strong{color:var(--accent)}
.fset{margin-bottom:22px}
.fset > h4{margin:0 0 12px; font-size:14px; font-weight:700; color:var(--primary); letter-spacing:.04em}
.frow{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.field{display:flex; flex-direction:column; gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13.5px; font-weight:500}
.field label .req{color:var(--accent); margin-left:3px}
.field .hint{font-size:12px; color:var(--ink-mute)}
.field input,.field select{
  padding:10px 12px; border:1px solid var(--line); border-radius:9px;
  background:#fff; outline:none; transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus{
  border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,95,168,.12);
}
.field.bad input,.field.bad select{border-color:var(--danger)}
.field .err{font-size:12px; color:var(--danger)}
.checks{display:flex; flex-direction:column; gap:10px}
.check{display:flex; gap:10px; padding:12px 14px; background:var(--bg); border:1px solid var(--line); border-radius:10px; cursor:pointer}
.check input{margin-top:3px}
.check span{font-size:13.5px; line-height:1.5}
.form-actions{display:flex; justify-content:space-between; gap:10px; margin-top:24px; padding-top:20px; border-top:1px solid var(--line)}

/* Confirm */
.summary{padding:28px 30px}
.summary .grp{display:grid; grid-template-columns:130px 1fr; gap:8px 20px; margin:14px 0}
.summary .grp .k{color:var(--ink-mute); font-size:13.5px}
.summary .grp .v{font-weight:500}
.summary h3{margin:0 0 6px; font-size:18px}
.terms{
  background:var(--bg); border-left:3px solid var(--primary);
  padding:14px 18px; border-radius:8px; margin:18px 0;
  font-size:13px; color:var(--ink-soft); line-height:1.7;
}
.terms b{color:var(--ink)}
.terms ol{margin:6px 0 0; padding-left:18px}
.fee-line{display:flex; justify-content:space-between; padding:6px 0; font-size:14px}
.fee-line.total{border-top:1px solid var(--line); margin-top:6px; padding-top:12px; font-size:18px; font-weight:700; color:var(--primary)}

/* Done */
.done-card{padding:48px 32px; text-align:center}
.done-icon{
  width:84px; height:84px; border-radius:50%; background:var(--success-soft);
  color:var(--success); display:grid; place-items:center; margin:0 auto 18px;
  font-size:42px;
}
.done-card h2{margin:0 0 6px; font-size:24px}
.done-card .reg-id{
  font-family:"SF Mono",Menlo,monospace; font-size:24px; font-weight:700; color:var(--primary);
  background:var(--primary-soft); padding:10px 20px; border-radius:10px;
  display:inline-block; margin:8px 0 18px; letter-spacing:.05em;
}
.done-card .next{color:var(--ink-soft); font-size:14px; max-width:480px; margin:0 auto 20px}
.notice-card{
  background:var(--warn-soft); border-left:4px solid var(--warn);
  padding:14px 18px; border-radius:8px; text-align:left;
  margin:14px auto; max-width:520px; font-size:13.5px; color:#6b4a17;
}

/* ═══════════════════════════════════════════════════
   Admin
   ═══════════════════════════════════════════════════ */
.admin-shell{display:grid; grid-template-columns:240px 1fr; gap:0; min-height:calc(100vh - 70px)}
.admin-side{
  background:#fff; border-right:1px solid var(--line); padding:18px 14px;
  position:sticky; top:71px; height:calc(100vh - 71px); overflow:auto;
}
.admin-side .title{font-size:13px; font-weight:700; color:var(--ink-mute); padding:0 8px 8px; letter-spacing:.05em}
.admin-side a{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:8px; font-size:14px;
  color:var(--ink-soft); cursor:pointer; margin-bottom:2px;
}
.admin-side a:hover{background:var(--line-soft); color:var(--ink)}
.admin-side a.active{background:var(--primary-soft); color:var(--primary); font-weight:600}
.admin-main{padding:24px 28px 60px; background:var(--bg); overflow:auto}
.admin-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px}
.admin-head h2{margin:0; font-size:22px}

.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
.kpi{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.kpi .lbl{font-size:13px; color:var(--ink-mute)}
.kpi .val{font-size:28px; font-weight:700; color:var(--primary); font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px; color:var(--ink-mute); margin-top:2px}

.chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.chart-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px}
.chart-card h3{margin:0 0 12px; font-size:15px; font-weight:600}
.chart-card.full{grid-column:1/-1}
.chart-card canvas{max-height:300px}

.table-wrap{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.table-wrap .table-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.tbl{width:100%; border-collapse:collapse; font-size:14px}
.tbl th{background:var(--bg); padding:10px 14px; text-align:left; font-weight:600; color:var(--ink-soft); border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:10px 14px; border-bottom:1px solid var(--line-soft)}
.tbl tr:hover td{background:var(--primary-tint)}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums}
.tbl .badge{padding:2px 8px; border-radius:999px; font-size:12px}
.tbl .badge.pending{background:var(--warn-soft); color:var(--warn)}
.tbl .badge.paid{background:var(--success-soft); color:var(--success)}

/* Modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(15,23,42,.5);
  display:none; align-items:center; justify-content:center; z-index:200;
  backdrop-filter:blur(2px);
}
.modal-bg.show{display:flex}
.modal{background:#fff; border-radius:16px; padding:28px 30px; width:min(420px,90vw); box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 6px; font-size:20px}
.modal p{color:var(--ink-mute); margin:0 0 18px; font-size:14px}

/* Print sheets */
.print-sheet{display:none}
.print-only{display:none}

/* ═══════════════════════════════════════════════════
   Print
   ═══════════════════════════════════════════════════ */
@media print{
  body{background:#fff}
  .topbar,.toolbar,.steps,.no-print,.admin-side,.admin-head,.kpi-row,.chart-grid{display:none !important}
  .container,.admin-main{padding:0; max-width:none}
  .print-only{display:block}
  .print-sheet{display:block; page-break-after:always}
  .print-sheet:last-child{page-break-after:auto}
  @page{size:A4; margin:14mm}
  @page :first{margin-top:14mm}

  .roster-sheet table{width:100%; border-collapse:collapse; font-size:11px}
  .roster-sheet th,.roster-sheet td{border:1px solid #333; padding:5px 4px; text-align:center}
  .roster-sheet th{background:#e8f0fb}
  .roster-sheet h1{font-size:16px; margin:0 0 6px; text-align:center}
  .roster-sheet .info{font-size:12px; margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px 16px}
  .roster-sheet .foot{font-size:11px; margin-top:10px; display:flex; justify-content:space-between}

  .notice-page{display:grid; grid-template-rows:1fr 1fr; gap:12mm; height:auto; min-height:267mm}
  .notice-slip{
    border:2px solid var(--primary); border-radius:6px; padding:12mm 14mm;
    page-break-inside:avoid; font-size:12.5px;
  }

/* ── Remote backend (Google Apps Script) ────────────────────── */
async function postRemoteReg(reg){
  if (!API_URL) return { ok:false, skipped:true };
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(reg),
    });
    const data = await res.json();
    return data;
  } catch(e){
    console.error("remote save failed", e);
    return { ok:false, error:String(e) };
  }
}
async function fetchRemoteRegs(){
  if (!API_URL) return null;
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP "+res.status);
    const arr = await res.json();
    return Array.isArray(arr) ? arr : null;
  } catch(e){
    console.error("remote load failed", e);
    return null;
  }
}
async function deleteRemoteReg(id){
  if (!API_URL) return { ok:true, skipped:true };
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"delete", id }),
    });
    return await res.json();
  } catch(e){
    console.error("remote delete failed", e);
    return { ok:false, error:String(e) };
  }
}
async function bulkSaveRemote(regs){
  if (!API_URL) return { ok:true, skipped:true };
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"bulkSave", regs }),
    });
    return await res.json();
  } catch(e){
    console.error("remote bulkSave failed", e);
    return { ok:false, error:String(e) };
  }
}
async function updateRemoteStatus(id, status){
  if (!API_URL) return { ok:true, skipped:true };
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"updateStatus", id, status }),
    });
    return await res.json();
  } catch(e){
    console.error("remote updateStatus failed", e);
    return { ok:false, error:String(e) };
  }
}

}

function afterConfirm(){
  $("#back2form").onclick = ()=>go("form");
  $("#submitFinal").onclick = async ()=>{
    const btn = $("#submitFinal");
    const club = state.selectedClub;
    const f = state.formData;
    // duplicate-time conflict check (single category only)
    const dupTime = state.registrations.find(r=>{
      if (r.classNo!==f.classNo || r.seatNo!==f.seatNo || r.studentName!==f.studentName) return false;
      const c2 = findClub(r.clubId);
      if (!c2) return false;
      if (c2.id===club.id) return true;
      // same category + same day/time slot
      if (r.category===state.category){
        if (CATEGORIES[state.category].showDay){
          return c2.day===club.day && c2.time===club.time;
        } else {
          return c2.time===club.time;
        }
      }
      return false;
    });
    if (dupTime){
      if (dupTime.clubId===club.id){
        if (!confirm("此學生已報名同一社團，確定再次送出？")) return;
      } else {
        if (!confirm("此學生已報名同一時段的另一社團，確定仍要送出？")) return;
      }
    }
    const reg = {
      id: nextRegId(state.category),
      category: state.category,
      clubId: club.id, clubName: club.name,
      classNo: f.classNo, seatNo: f.seatNo, studentName: f.studentName,
      contactName: f.contactName, contactPhone: f.contactPhone, email: f.email,
      totalFee: club.total, agreedTerms:true,
      timestamp: new Date().toISOString(), status:"pending",
    };
    // Remote save
    if (API_URL){
      btn.disabled = true; btn.textContent = "送出中…";
      const result = await postRemoteReg(reg);
      btn.disabled = false; btn.textContent = "✓ 確認送出報名";
      if (!result.ok){
        alert("送出失敗，請檢查網路後重試。\n" + (result.error||""));
        return;
      }
    }
    state.registrations.push(reg);
    saveRegs();
    state.myReg = reg;
    go("done");
  };
}

/* steps */
function stepsHtml(active){
  const list = [["1","選擇社團"],["2","填寫資料"],["3","確認報名"],["4","完成"]];
  return `<div class="steps">${list.map(([n,l],i)=>{

    return `<div class="step ${cls}"><div class="num">${cls==="done"?"✓":n}</div><div class="lbl">${l}</div>${i<3?'<div class="line"></div>':""}</div>`;
  }).join("")}</div>`;
}

  const labels = clubs_115.map(c=>c.name);
  const taken = clubs_115.map(c=>spotsTaken(c.id));

function buildPaymentGrid(category){
  const inferCat = (id)=>{
    const s = String(id||"");
    if (s.startsWith("SUM")) return "summer";
    if (s.startsWith("G1"))  return "grade1";
    return "115";
  };
  let pool = state.registrations.slice().map(r => ({
    ...r,
    category: (r.category && String(r.category).trim()) || inferCat(r.clubId),
  }));
  let clubList;
  if (category==="all") clubList = allClubs();
  else { pool = pool.filter(r=>r.category===category); clubList = CATEGORIES[category].data; }
  const presentClubs = clubList.filter(c => pool.some(r=>r.clubId===c.id));
  // group by student
  const byStudent = {};
  pool.forEach(r=>{ const k=`${r.classNo}|${r.seatNo}|${r.studentName}`; (byStudent[k] ||= []).push(r); });
  const stus = Object.values(byStudent).sort((a,b)=>{
    const A=a[0],B=b[0]; return String(A.classNo).localeCompare(String(B.classNo)) || String(A.seatNo).localeCompare(String(B.seatNo));
  });
  const head = ["序號","班級","座號","姓名", ...presentClubs.map(c=>c.name), "合計"];
  const rows = stus.map((stu,i)=>{
    const r = stu[0];
    const map = {}; stu.forEach(x=>map[x.clubId]=x.totalFee);
    const fees = presentClubs.map(c => map[c.id] || "");
    const total = stu.reduce((s,x)=>s+x.totalFee,0);
    return [i+1, r.classNo, r.seatNo, r.studentName, ...fees, total];
  });
  return { head, rows, clubs:presentClubs };
}

async function exportPayment(category, btn){
  const titleMap = { "115":"115學年度上學期 社團繳費清單", "summer":"114年度暑假社團 繳費清單", "grade1":"115學年度 小一社團 繳費清單", "all":"115學年度 社團繳費清單（總表）" };
  const catLabel = { "115":"115上學期", "summer":"暑假社團", "grade1":"小一社團" };
  const title = titleMap[category];

  if (!API_URL){ alert("尚未設定後端 API_URL，無法產生伺服器端報表。"); return; }

  const origText = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = "產生中…"; }
  try {
    // 向 GAS 取得最新完整報名資料（JSON）
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"exportPayment", category, title }),
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); }
    catch { throw new Error("後端回傳非 JSON：" + text.slice(0,200)); }
    if (!json.ok) throw new Error(json.error || "Export failed");

    // 用瀏覽器端 xlsx.js 產生 Excel
    const regs = json.regs || [];
    const headers = ["報名編號","類別","社團名稱","班級","座號","學生姓名","聯絡人","聯絡電話","Email","總費用（元）","報名時間","繳費狀態"];
    const wsData = [
      [title],
      headers,
      ...regs.map(r=>[
        r.id,
        catLabel[r.category] || r.category,
        r.clubName,
        r.classNo,
        r.seatNo,
        r.studentName,
        r.contactName,
        r.contactPhone,
        r.email || "",
        r.totalFee,
        r.timestamp,
        r.status==="paid" ? "已繳費" : "待繳費",
      ])
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    // 合併第一列標題
    ws["!merges"] = [{ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, title.slice(0,30));
    XLSX.writeFile(wb, json.filename || `雙蓮國小_${title}.xlsx`);
  } catch(e){
    alert("匯出失敗：" + e.message);
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = origText; }
  }
}

function renderSettings(body){
  body.innerHTML = `
    <div class="card" style="padding:24px 28px; max-width:640px">
      <h3 style="margin-top:0">系統設定</h3>
      <p class="muted">本系統的所有報名資料儲存於使用者的瀏覽器（localStorage）。</p>

      <div class="divider"></div>
      <h4>📦 資料管理</h4>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin:12px 0">
        <button class="btn" id="se-export">下載備份 JSON</button>
        <button class="btn" id="se-import">匯入備份 JSON</button>
        <button class="btn" id="se-seed">重新載入示範資料</button>
        <button class="btn" id="se-clear" style="background:var(--danger); color:#fff; border-color:var(--danger)">⚠ 清空所有報名</button>
      </div>

      <div class="divider"></div>
      <h4>🔑 後台密碼</h4>
      <p class="muted" style="font-size:13px">目前後台密碼：<code>${ADMIN_PASSWORD}</code>（如需更改，請於原始 HTML 修改 <code>ADMIN_PASSWORD</code> 常數）</p>
    </div>`;
  $("#se-export").onclick = ()=>downloadFile(`雙蓮國小_報名資料_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state.registrations,null,2), "application/json");
  $("#se-import").onclick = ()=>{
    const inp = document.createElement("input"); inp.type="file"; inp.accept="application/json";
    inp.onchange = async e=>{
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        try {
          const arr = JSON.parse(reader.result);
          if (!Array.isArray(arr)) throw new Error("格式錯誤");
          if (!confirm(`即將匯入 ${arr.length} 筆資料，將覆蓋現有資料（包含伺服器），確定？`)) return;
          const btn = $("#se-import");
          btn.disabled = true; btn.textContent = "匯入中…";
          if (API_URL) {
            const result = await bulkSaveRemote(arr);
            if (!result.ok && !result.skipped) {
              alert("伺服器匯入失敗：" + (result.error||""));
              btn.disabled = false; btn.textContent = "匯入備份 JSON"; return;
            }
          }
          state.registrations = arr; saveRegs();
          btn.disabled = false; btn.textContent = "匯入備份 JSON";
          alert("匯入成功！"); renderAdmin();
        } catch(err){ alert("匯入失敗："+err.message); }
      };
      reader.readAsText(f);
    };
    inp.click();
  };
  $("#se-seed").onclick = async ()=>{
    if (!confirm("將清空現有資料並載入示範資料（包含伺服器），確定？")) return;
    const btn = $("#se-seed");
    btn.disabled = true; btn.textContent = "載入中…";
    state.registrations = []; seedDemo(); // 先在本機產生示範資料
    if (API_URL) {
      const result = await bulkSaveRemote(state.registrations);
      if (!result.ok && !result.skipped) {
        alert("伺服器同步失敗：" + (result.error||"") + "\n（示範資料已存入本機）");
      }
    }
    btn.disabled = false; btn.textContent = "重新載入示範資料";
    renderAdmin();
  };
  $("#se-clear").onclick = async ()=>{
    if (!confirm("確定清空所有報名資料？此動作無法復原。")) return;
    const btn = $("#se-clear");
    btn.disabled = true; btn.textContent = "清空中…";
    // 同步刪除 Google 試算表資料
    if (API_URL) {
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action:"clearAll" }),
        });
        const result = await res.json();
        if (!result.ok) { alert("遠端清空失敗：" + (result.error||"")); btn.disabled=false; btn.textContent="⚠ 清空所有報名"; return; }
      } catch(e) { alert("遠端清空失敗：" + e.message); btn.disabled=false; btn.textContent="⚠ 清空所有報名"; return; }
    }
    state.registrations = []; saveRegs();
    btn.disabled = false; btn.textContent = "⚠ 清空所有報名";
    alert("已清空所有報名資料！");
    renderAdmin();
  };
}

function downloadFile(name, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

$$(".nav-btn").forEach(b=>b.onclick = ()=>go(b.dataset.nav));
$("#adminGear").onclick = ()=>{
  if (state.isAdmin) { state.view="admin"; render(); return; }
  $("#loginModal").classList.add("show");
  $("#adminPass").value=""; $("#loginErr").style.display="none";
  setTimeout(()=>$("#adminPass").focus(), 50);
};
$("#loginCancel").onclick = ()=>$("#loginModal").classList.remove("show");
$("#loginOk").onclick = tryLogin;
$("#adminPass").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
function tryLogin(){
  if ($("#adminPass").value === ADMIN_PASSWORD){
    state.isAdmin=true;
    $("#loginModal").classList.remove("show");
    state.view="admin"; render();
  } else {
    $("#loginErr").style.display="block";
  }
}

(async ()=>{
  if (API_URL){
    const remote = await fetchRemoteRegs();
    if (remote) { state.registrations = remote; saveRegs(); }
  } else {
    if (state.registrations.length === 0) seedDemo();
  }
  render();
})();
</script>
