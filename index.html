<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>臺北市雙蓮國小・社團報名系統｜115上學期暨暑期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#1a5fa8;--primary-dark:#134777;--primary-soft:#e8f0fb;--primary-tint:#f3f7fc;
  --accent:#e05c2a;--accent-soft:#fce5cd;--success:#1e8a5e;--success-soft:#e0f2e9;
  --purple:#7c5dc8;--purple-soft:#ece6f8;--warn:#c97a1a;--warn-soft:#fff4e0;--danger:#c0392b;
  --ink:#1f2937;--ink-soft:#4b5563;--ink-mute:#6b7280;--line:#e5e7eb;--line-soft:#f1f3f5;
  --bg:#f7f9fc;--card:#ffffff;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03);
  --shadow:0 4px 16px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 18px 48px rgba(15,23,42,.12),0 4px 12px rgba(15,23,42,.06);
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;}
.topbar .crest{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 4px 10px rgba(26,95,168,.25);}
.topbar .school{display:flex;flex-direction:column;line-height:1.25}
.topbar .school .name{font-weight:700;font-size:16px}
.topbar .school .sys{font-size:12px;color:var(--ink-mute)}
.topbar nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.topbar nav button{padding:8px 14px;border-radius:8px;font-size:14px;color:var(--ink-soft);font-weight:500;}
.topbar nav button:hover{background:var(--primary-soft);color:var(--primary)}
.topbar nav button.active{background:var(--primary);color:#fff}
.topbar nav .gear{width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-mute);padding:0;line-height:1;vertical-align:middle;}
.topbar nav .gear:hover{background:var(--line-soft);color:var(--primary)}
.container{max-width:1180px;margin:0 auto;padding:28px 24px 80px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:10px;font-weight:500;font-size:15px;background:#fff;color:var(--ink);border:1px solid var(--line);transition:all .15s ease;}
.btn:hover{background:var(--line-soft);border-color:#d4d8de}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:#c44e1f;border-color:#c44e1f}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-lg{padding:14px 26px;font-size:16px}
.btn-sm{padding:7px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.section-title{display:flex;align-items:baseline;gap:12px;margin:28px 0 16px}
.section-title h2{margin:0;font-size:22px;font-weight:700}
.section-title .sub{color:var(--ink-mute);font-size:14px}
.muted{color:var(--ink-mute)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.6;background:var(--line-soft);color:var(--ink-soft);}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.tag.full{background:#fde2e2;color:var(--danger)}
.divider{height:1px;background:var(--line);margin:18px 0}
.hero{background:linear-gradient(135deg,#1a5fa8 0%,#2670bd 60%,#3a8bd8 100%);color:#fff;border-radius:var(--r-xl);padding:36px 36px 32px;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.08);}
.hero::after{content:"";position:absolute;right:80px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.06);}
.hero .eyebrow{font-size:13px;letter-spacing:.18em;opacity:.85;font-weight:500}
.hero h1{margin:8px 0 6px;font-size:34px;font-weight:900;letter-spacing:-.01em}
.hero .lede{opacity:.9;font-size:15px;max-width:580px}
.hero .meta{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
.hero .meta .it{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.92}
.hero .meta .dot{width:6px;height:6px;border-radius:50%;background:#fff}
.entries{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.entry{border-radius:var(--r-lg);padding:24px 22px 22px;border:1px solid var(--line);background:#fff;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:200px;}
.entry:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
.entry .badge{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:14px;}
.entry h3{margin:0 0 4px;font-size:19px;font-weight:700}
.entry .sub{color:var(--ink-mute);font-size:13.5px;margin-bottom:14px}
.entry .stat{display:flex;gap:10px;margin-top:auto;font-size:13px;color:var(--ink-soft)}
.entry.blue .badge{background:var(--primary-soft);color:var(--primary)}
.entry.blue:hover{box-shadow:0 18px 40px rgba(26,95,168,.18)}
.entry.orange .badge{background:#fdebde;color:var(--accent)}
.entry.orange:hover{box-shadow:0 18px 40px rgba(224,92,42,.18)}
.entry.purple .badge{background:var(--purple-soft);color:var(--purple)}
.entry.purple:hover{box-shadow:0 18px 40px rgba(124,93,200,.18)}
.entry .arrow{position:absolute;right:18px;top:22px;color:var(--ink-mute);transition:transform .18s ease}
.entry:hover .arrow{transform:translateX(4px);color:var(--primary)}
.timeline{padding:24px 26px}
.tl-grid{display:grid;grid-template-columns:140px 1fr 130px;gap:0}
.tl-row{display:contents}
.tl-row > *{padding:11px 12px;border-top:1px solid var(--line-soft)}
.tl-row:first-child > *{border-top:0}
.tl-stage{font-weight:600;color:var(--accent);font-size:13.5px}
.tl-stage.s2{color:var(--primary)}
.tl-stage.prep{color:var(--ink-mute)}
.tl-stage.open{color:var(--success);font-weight:700}
.tl-task{font-size:14px}
.tl-date{font-size:13px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums}
.tl-row.highlight .tl-task,.tl-row.highlight .tl-date{font-weight:700;color:var(--ink)}
.tl-row.highlight .tl-stage{color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:18px;position:sticky;top:71px;z-index:30;}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border-color .15s,background .15s;}
.search input:focus{border-color:var(--primary);background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;background:var(--line-soft);color:var(--ink-soft);font-weight:500;transition:all .12s;}
.chip:hover{background:#e7eaf0}
.chip.active{background:var(--primary);color:#fff}
.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.club{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s,border-color .15s;position:relative;}
.club:hover{box-shadow:var(--shadow);border-color:#dde2ea}
.club .head{display:flex;align-items:flex-start;gap:10px}
.club .name{font-weight:700;font-size:16.5px;flex:1;line-height:1.4}
.club .price{font-weight:700;color:var(--primary);font-size:18px;font-variant-numeric:tabular-nums}
.club .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;color:var(--ink-soft)}
.club .meta .lbl{color:var(--ink-mute);white-space:nowrap}
.club .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.club .note{font-size:12.5px;color:var(--ink-mute);padding-top:8px;border-top:1px dashed var(--line);line-height:1.55}
.club .footer{display:flex;align-items:center;gap:10px;margin-top:6px}
.spots{display:flex;align-items:center;gap:8px;flex:1;font-size:13px;color:var(--ink-soft)}
.spots .bar{flex:1;height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.spots .bar i{display:block;height:100%;background:var(--success);border-radius:999px}
.spots.warn .bar i{background:var(--warn)}
.spots.full .bar i{background:var(--danger)}
.empty{text-align:center;padding:60px 20px;color:var(--ink-mute)}
.empty .ico{font-size:38px;margin-bottom:10px}
.steps{display:flex;gap:0;align-items:center;margin-bottom:22px}
.step{display:flex;align-items:center;gap:9px;flex:1}
.step .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-mute);font-weight:700;font-size:13px;flex-shrink:0;}
.step.active .num{background:var(--primary);color:#fff}
.step.done .num{background:var(--success);color:#fff}
.step .lbl{font-size:14px;color:var(--ink-mute);font-weight:500}
.step.active .lbl,.step.done .lbl{color:var(--ink)}
.step .line{flex:1;height:2px;background:var(--line);margin:0 4px}
.step.done .line{background:var(--success)}
.form-card{padding:28px 30px}
.warn-box{background:var(--accent-soft);border:1px solid #f5b483;color:#7c3a0e;border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;margin-bottom:22px;}
.warn-box .ico{font-size:22px;flex-shrink:0;line-height:1.1}
.fset{margin-bottom:22px}
.fset > h4{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--primary);letter-spacing:.04em}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13.5px;font-weight:500}
.field label .req{color:var(--accent);margin-left:3px}
.field .hint{font-size:12px;color:var(--ink-mute)}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,95,168,.12);}
.field.bad input,.field.bad select{border-color:var(--danger)}
.field .err{font-size:12px;color:var(--danger)}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:10px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.check input{margin-top:3px}
.check span{font-size:13.5px;line-height:1.5}
.form-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.summary{padding:28px 30px}
.summary .grp{display:grid;grid-template-columns:130px 1fr;gap:8px 20px;margin:14px 0}
.summary .grp .k{color:var(--ink-mute);font-size:13.5px}
.summary .grp .v{font-weight:500}
.summary h3{margin:0 0 6px;font-size:18px}
.terms{background:var(--bg);border-left:3px solid var(--primary);padding:14px 18px;border-radius:8px;margin:18px 0;font-size:13px;color:var(--ink-soft);line-height:1.7;}
.terms b{color:var(--ink)}
.terms ol{margin:6px 0 0;padding-left:18px}
.fee-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.fee-line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:700;color:var(--primary)}
.done-card{padding:48px 32px;text-align:center}
.done-icon{width:84px;height:84px;border-radius:50%;background:var(--success-soft);color:var(--success);display:grid;place-items:center;margin:0 auto 18px;font-size:42px;}
.done-card h2{margin:0 0 6px;font-size:24px}
.done-card .reg-id{font-family:"SF Mono",Menlo,monospace;font-size:24px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:10px 20px;border-radius:10px;display:inline-block;margin:8px 0 18px;letter-spacing:.05em;}
.done-card .next{color:var(--ink-soft);font-size:14px;max-width:480px;margin:0 auto 20px}
.notice-card{background:var(--warn-soft);border-left:4px solid var(--warn);padding:14px 18px;border-radius:8px;text-align:left;margin:14px auto;max-width:520px;font-size:13.5px;color:#6b4a17;}
.admin-shell{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - 70px)}
.admin-side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:71px;height:calc(100vh - 71px);overflow:auto;}
.admin-side .title{font-size:13px;font-weight:700;color:var(--ink-mute);padding:0 8px 8px;letter-spacing:.05em}
.admin-side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--ink-soft);cursor:pointer;margin-bottom:2px;}
.admin-side a:hover{background:var(--line-soft);color:var(--ink)}
.admin-side a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.admin-main{padding:24px 28px 60px;background:var(--bg);overflow:auto}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.admin-head h2{margin:0;font-size:22px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .lbl{font-size:13px;color:var(--ink-mute)}
.kpi .val{font-size:28px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink-mute);margin-top:2px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.chart-card h3{margin:0 0 12px;font-size:15px;font-weight:600}
.chart-card.full{grid-column:1/-1}
.chart-card canvas{max-height:300px}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.table-wrap .table-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--bg);padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.tbl tr:hover td{background:var(--primary-tint)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .badge{padding:2px 8px;border-radius:999px;font-size:12px}
.tbl .badge.pending{background:var(--warn-soft);color:var(--warn)}
.tbl .badge.paid{background:var(--success-soft);color:var(--success)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px);}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:28px 30px;width:min(420px,90vw);box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 6px;font-size:20px}
.modal p{color:var(--ink-mute);margin:0 0 18px;font-size:14px}
.print-sheet{display:none}
.print-only{display:none}
@media print{
  body{background:#fff}
  .topbar,.toolbar,.steps,.no-print,.admin-side,.admin-head,.kpi-row,.chart-grid{display:none !important}
  .container,.admin-main{padding:0;max-width:none}
  .print-only{display:block}
  .print-sheet{display:block;page-break-after:always}
  .print-sheet:last-child{page-break-after:auto}
  @page{size:A4 portrait;margin:15mm}
  @page roster{size:A4 landscape;margin:14mm}
  .roster-sheet{page:roster}
  .roster-sheet table{width:100%;border-collapse:collapse;font-size:10.5px}
  .roster-sheet th,.roster-sheet td{border:1px solid #666;padding:5px 4px;text-align:center}
  .roster-sheet th{background:#1a5fa8;color:#fff;font-weight:600;font-size:10px;padding:6px 4px}
  .roster-sheet td{background:#fff}
  .roster-sheet tbody tr:nth-child(even) td{background:#f8f9fa}
  .roster-sheet tbody td:first-child{background:#1a5fa8;font-weight:600;color:#fff}
  .roster-sheet h1{font-size:16px;margin:0 0 8px;text-align:center;font-weight:700;color:#1a5fa8}
  .roster-sheet .info{font-size:11.5px;margin-bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;padding:8px 12px;background:#f0f4f8;border-radius:4px;border-left:4px solid #1a5fa8}
  .roster-sheet .info b{color:#1a5fa8}
  .roster-sheet .foot{font-size:11px;margin-top:10px;display:flex;justify-content:space-between;padding-top:8px;border-top:2px solid #1a5fa8}
  .roster-sheet thead{display:table-header-group}
}
@media screen{.print-only{display:none !important}}
@media (max-width:760px){
  .topbar{padding:12px 14px}
  .container{padding:16px 14px 60px}
  .hero{padding:24px 22px}
  .hero h1{font-size:24px}
  .entries{grid-template-columns:1fr;gap:12px}
  .frow{grid-template-columns:1fr}
  .form-card,.summary{padding:20px 18px}
  .toolbar{position:static}
  .admin-shell{grid-template-columns:1fr}
  .admin-side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;padding:10px}
  .admin-side .title{display:none}
  .admin-side a{margin:0;padding:7px 10px;font-size:13px}
  .admin-main{padding:16px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .tl-grid{grid-template-columns:90px 1fr 100px}
  .tl-row > *{padding:8px 6px}
  .tl-stage,.tl-task,.tl-date{font-size:12.5px}
  .summary .grp{grid-template-columns:1fr}
  .summary .grp .k{font-size:12px;color:var(--ink-mute);margin-bottom:-4px}
  .step .lbl{font-size:12px}
  .step .num{width:24px;height:24px;font-size:12px}
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.view{animation:pop .25s ease-out}
.tab-btn{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);transition:all .15s;font-family:inherit}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar no-print">
    <div class="crest">雙</div>
    <div class="school">
      <div class="name">臺北市雙蓮國小</div>
      <div class="sys">115上學期暨暑期課外社團報名系統</div>
    </div>
    <nav>
      <button class="nav-btn" data-nav="home">首頁</button>

async function postRemoteReg(reg){
  if(!API_URL)return{ok:false,skipped:true};
  try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(reg)});return await res.json();}
  catch(e){return{ok:false,error:String(e)};}
}
async function fetchRemoteRegs(){
  if(!API_URL)return null;
  try{const res=await fetch(API_URL+"?t="+Date.now());if(!res.ok)throw new Error("HTTP "+res.status);const arr=await res.json();return Array.isArray(arr)?arr:null;}
  catch(e){return null;}
}
async function deleteRemoteReg(id,clubId){
  if(!API_URL)return{ok:true,skipped:true};
  try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",id,clubId})});return await res.json();}
  catch(e){return{ok:false,error:String(e)};}

function nextRegId(category,stage=1){
  const is115S2=category==="115"&&stage===2;

function renderClubGrid(){
  const cat=CATEGORIES[state.category];

  if(state.filterDay!=="全部"){
    list=list.filter(c=>cat.showDay?c.day===state.filterDay:c.time.startsWith(state.filterDay));
  }
  if(state.filterType!=="all")list=list.filter(c=>c.type===state.filterType);
  if(state.search.trim()){
    const q=state.search.trim().toLowerCase();
    list=list.filter(c=>(c.name+c.teacher+c.location).toLowerCase().includes(q));
  }
  /* ★ PATCH 2 & 3: 第二階段開放報名，且只顯示未額滿的社團 */
  const regOpen=true;
  if(state.stage===2){
    list=list.filter(c=>c.spots>0||(!c.spots&&c.spots!==0));
  }
  if(!list.length){
    grid.innerHTML=`<div class="empty"><div class="ico">${state.stage===2?"🎉":"🔍"}</div>${state.stage===2?"目前所有社團皆已額滿，敬請期待下次報名機會。":"找不到符合條件的社團，請調整篩選。"}</div>`;
    return;
  }
  grid.innerHTML=`<div class="club-grid">${list.map(c=>{
    const unlimited=!c.spots&&c.spots!==0;
    const taken=spotsTaken(c.id);
    const remain=unlimited?Infinity:Math.max(0,c.spots-taken);
    const pct=unlimited?0:Math.min(100,Math.round(taken/c.spots*100));
    const full=!unlimited&&remain<=0;

    return`
    <article class="club">
      <div class="head">
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="price">${fmt$(c.total)}</div>
      </div>

        ${cat.showDay?`<span class="lbl">時間</span><span>${c.day} ${c.time}</span>`:`<span class="lbl">時段</span><span>${c.time}</span>`}

      </div>
      <div class="tags">
        ${c.isNew?'<span class="tag new">新增</span>':""}
        ${!unlimited&&!c.hideRemainTag&&remain<=3&&!full?`<span class="tag" style="background:var(--warn-soft);color:var(--warn)">剩 ${remain} 位</span>`:""}
      </div>
      ${c.note?`<div class="note">${escapeHtml(c.note)}</div>`:""}
      <div class="footer">
        ${unlimited?`<div class="spots"><span>已報名 ${taken} 人・名額不限</span></div>`:`<div class="spots ${stat}">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span>${taken}/${c.spots}</span>
        </div>`}
        ${state.category==="summer"?'<span style="font-size:12px;color:var(--ink-mute);text-align:right;line-height:1.4">請至學務處<br>現場報名繳費</span>':state.category==="grade1"?'<span style="font-size:12px;color:var(--ink-mute);text-align:right;line-height:1.4">尚未開放<br>報名</span>':'<button class="btn btn-sm btn-primary" data-pick="'+c.id+'">立即報名</button>'}
      </div>
    </article>`;
  }).join("")}</div>`;
  $$("[data-pick]").forEach(b=>b.addEventListener("click",e=>{
    const club=findClub(e.currentTarget.dataset.pick);
    go("form",{selectedClub:club,formData:{}});

function gradeFromClass(classNo){const m=String(classNo||"").match(/\d/);return m?parseInt(m[0],10):null;}
function gradeAllowed(club,classNo){
  const g=gradeFromClass(classNo);if(g==null||!club)return true;
  const spec=String(club.grade||"");
  if(spec.indexOf("小一")>=0)return g===1;
  const range=spec.match(/(\d)\s*[-~]\s*(\d)/);if(range)return g>=+range[1]&&g<=+range[2];
  const single=spec.match(/(\d)\s*年級/);if(single)return g===+single[1];
  return true;
}
function submitForm(){

  if(!f.classNo){$("#f-class").parentElement.classList.add("bad");bad=true;}
  if(!f.seatNo){$("#f-seat").parentElement.classList.add("bad");bad=true;}
  if(!f.studentName){$("#f-student").parentElement.classList.add("bad");bad=true;}

  if(!/^09\d{8}$/.test(f.contactPhone)){$("#f-phone").parentElement.classList.add("bad");bad=true;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)){$("#f-email").parentElement.classList.add("bad");bad=true;}
  if(!f.agree1){alert("請勾選注意事項確認");bad=true;}
  if(bad){window.scrollTo({top:0,behavior:"smooth"});return;}
  if(!gradeAllowed(state.selectedClub,f.classNo)){alert(`報名失敗：此社團招生條件為「${state.selectedClub.grade}」，您選擇的班級（${f.classNo}）年級不符合資格，無法報名。`);$("#f-class").parentElement.classList.add("bad");window.scrollTo({top:0,behavior:"smooth"});return;}
  state.formData=f;go("confirm");
}

function renderRoster(body){

  const CLASS_S={週一:["9/8","9/15","9/22","9/29","10/6","10/13","10/20","10/27","11/3","11/10","11/17","11/24","12/1","12/8","12/15","12/22","1/5","1/12","1/19"],週二:["9/9","9/16","9/23","9/30","10/7","10/14","10/21","10/28","11/4","11/11","11/18","11/25","12/2","12/9","12/16","12/23","12/30","1/6","1/13","1/20"],週三:["9/10","9/17","9/24","10/1","10/8","10/15","10/22","10/29","11/5","11/12","11/19","11/26","12/3","12/10","12/17","12/24","12/31","1/7","1/14","1/21"],週四:["9/11","9/18","9/25","10/2","10/9","10/16","10/23","10/30","11/6","11/13","11/20","11/27","12/4","12/11","12/18","12/25","1/1","1/8","1/15","1/22"],週五:["9/12","9/19","9/26","10/3","10/10","10/17","10/24","10/31","11/7","11/14","11/21","11/28","12/5","12/12","12/19","12/26","1/2","1/9","1/16","1/23"]};
  function buildSheet(clubId){
    const clubIds=clubId==="all"?clubs_115.map(c=>c.id):[clubId];
    return clubIds.map(cid=>{
      const c=findClub(cid);if(!c)return"";
      // 第二階段：從 Google Sheet

      const s1rows=PAID_D.filter(p=>p.paid.some(x=>x.club===clubName||x.club===clubName+"(暑)")).map(p=>{
        const paidItem=p.paid.find(x=>x.club===clubName||x.club===clubName+"(暑)");
        return {classNo:p.cls,seatNo:p.seat,studentName:p.name,contactName:"",contactPhone:"",stage:1,totalFee:paidItem?paidItem.amt:0};
      });
      // 合併去重（以班級+座號+姓名為 key）
      const seen=new Set(s2rows.map(r=>`${r.classNo}-${r.seatNo}-${r.studentName}`));
      const merged=[...s2rows,...s1rows.filter(r=>!seen.has(`${r.classNo}-${r.seatNo}-${r.studentName}`))];
      const rows=merged.sort((a,b)=>String(a.classNo).localeCompare(String(b.classNo))||String(a.seatNo).localeCompare(String(b.seatNo)));
      const sessionCount=c.sessions||17;
      const sessions=(CLASS_S[c.day]||[]).slice(0,sessionCount);
      let fixedCols={seq:3,class:5,seat:4,name:8,contact:8,note:6};let dateWidth=(100-34)/sessionCount;

      const sessCell=sessions.map(()=>`<td></td>`).join("");
      const pages=[];for(let i=0;i<rows.length;i+=25)pages.push(rows.slice(i,i+25));
      if(pages.length===0)pages.push([]);
      return pages.map((pageRows,pageIdx)=>`<div class="roster-sheet print-sheet" style="background:#fff;padding:14mm 12mm;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);page-break-after:always"><h1>臺北市雙蓮國小　115學年度上學期　社團點名表</h1><div class="info"><div><b>社團名稱：</b>${escapeHtml(c.name)}</div><div><b>授課教師：</b>${escapeHtml(c.teacher)}</div><div><b>上課時間：</b>${c.day} ${c.time}</div><div><b>上課地點：</b>${escapeHtml(c.location)}</div><div><b>開始日期：</b>${sessions[0]||"待定"}</div><div><b>上課次數：</b>共 ${c.sessions} 次</div></div><table><thead><tr><th style="width:${fixedCols.seq}%">序</th><th style="width:${fixedCols.class}%">班級</th><th style="width:${fixedCols.seat}%">座號</th><th style="width:${fixedCols.name}%">姓名</th><th style="width:${fixedCols.contact}%">聯絡人</th>${sessHead}<th style="width:${fixedCols.note}%">備註</th></tr></thead><tbody>${pageRows.map((r,ri)=>`<tr><td>${i+ri+1}</td><td>${escapeHtml(r.classNo)}</td><td>${escapeHtml(r.seatNo)}</td><td style="text-align:left;padding-left:8px">${escapeHtml(r.studentName)}</td><td style="text-align:left;padding-left:6px;font-size:9px">${escapeHtml(r.contactName||"")}<br>${escapeHtml(r.contactPhone||"")}</td>${sessCell}<td></td></tr>`).join("")}</tbody></table><div class="foot"><div>共 ${rows.length} 人${pages.length>1?` （第 ${pageIdx+1}/${pages.length} 頁）`:""}</div><div>列印日期：____ 年 __ 月 __ 日</div></div></div>`).join("");
    }).join("");
  }
  $("#rs-preview").onclick=()=>{$("#rs-preview-area").innerHTML=buildSheet($("#rs-club").value);};
  $("#rs-print").onclick=()=>{$("#printRegion").innerHTML=buildSheet($("#rs-club").value);setTimeout(()=>window.print(),100);};
  $("#rs-preview-area").innerHTML=buildSheet("all");
}
function renderNotice(body){

ing-top:6px;border-top:1px solid #ddd;font-size:10px;color:#666">如有問題請洽雙蓮國小學務處訓育組 羅老師 Tel：02-25570309 轉 1022</div></div>`).join("");
  }
  $("#nt-cat").onchange=()=>{$("#nt-preview-area").innerHTML=buildNotice($("#nt-cat").value);};

function renderSummary(body){
  body.innerHTML=`<div class="card" style="padding:24px 28px"><h3 style="margin-top:0">全校學生社團一覽</h3><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn btn-primary" id="sm-115">📊 匯出：115上學期</button><button class="btn btn-accent" id="sm-summer">📊 匯出：115暑假</button><button class="btn" style="background:var(--purple);color:#fff;border-color:var(--purple)" id="sm-grade1">📊 匯出：小一新生</button></div><div class="divider"></div><div id="sm-preview" style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px"></div></div>`;
  function exportByCategory(category,title){
    const inferCat=(id)=>{const s=String(id||"");if(s.startsWith("SUM"))return"summer";if(s.startsWith("G1"))return"grade1";return"115";};

    const rows=filtered.map(r=>{const c=findClub(r.clubId);return{classNo:r.classNo,seatNo:r.seatNo,studentName:r.studentName,clubName:r.clubName,time:c?(c.day||"")+" "+c.time:"",location:c?c.location:""};}).sort((a,b)=>String(a.classNo).localeCompare(String(b.classNo))||String(a.seatNo).localeCompare(String(b.seatNo)));
    const headers=["班級","座號","姓名","社團","時間","上課地點"];

    const ws=XLSX.utils.aoa_to_sheet(wsData);ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:headers.length-1}}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,title.slice(0,30));XLSX.writeFile(wb,`雙蓮國小_${title}_學生一覽.xlsx`);

  $("#sm-115").onclick=()=>exportByCategory("115","115上學期社團");
  $("#sm-summer").onclick=()=>exportByCategory("summer","115暑假社團");

  $("#sm-preview").innerHTML=`<table class="tbl"><thead><tr><th>類別</th><th>班級</th><th>座號</th><th>姓名</th><th>社團</th><th>時間</th></tr></thead><tbody>${allRows.map(row=>`<tr><td><span class="tag">${escapeHtml(row.category)}</span></td><td>${escapeHtml(row.classNo)}</td><td>${escapeHtml(row.seatNo)}</td><td>${escapeHtml(row.studentName)}</td><td>${escapeHtml(row.clubName)}</td><td>${escapeHtml(row.time)}</td></tr>`).join("")}</tbody></table>`;
}
function renderPayment(body){
  body.innerHTML=`<div class="card" style="padding:24px 28px"><h3 style="margin-top:0">繳費單下載</h3><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn btn-primary" id="pay-phase1">📊 第一階段匯出</button><button class="btn btn-primary" id="pay-phase2">📊 第二階段匯出</button><button class="btn" style="background:var(--purple);color:#fff;border-color:var(--purple)" id="pay-grade1">📊 小一匯出</button></div><div class="divider"></div><div id="pay-preview" style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px"></div></div>`;
  $("#pay-phase1").onclick=(e)=>exportPayment("phase1",e.currentTarget);
  $("#pay-phase2").onclick=(e)=>exportPayment("phase2",e.currentTarget);
  $("#pay-grade1").onclick=(e)=>exportPayment("grade1",e.currentTarget);
  const grid=buildPaymentGrid("115");
  $("#pay-preview").innerHTML=`<table class="tbl" style="font-size:12px"><thead><tr>${grid.head.map((h,i)=>`<th style="background:#1a5fa8;color:#fff;${i===4?"background:#fce5cd;color:#1f2937":""}">${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${grid.rows.slice(0,30).map(r=>`<tr>${r.map((v,i)=>{if(i<4)return`<td>${escapeHtml(v||"")}</td>`;if(i===4)return`<td class="num" style="background:#fce5cd;font-weight:700">${v?fmt$(v):"—"}</td>`;return`<td class="num" style="background:${v?"#e8f0fb":"transparent"}">${v?v.toLocaleString():"—"}</td>`;}).join("")}</tr>`).join("")}</tbody></table>`;

function buildPaymentGrid(category){
  const inferCat=(id)=>{const s=String(id||"");if(s.startsWith("SUM"))return"summer";if(s.startsWith("G1"))return"grade1";return"115";};
  let pool=state.registrations.slice().map(r=>({...r,category:(r.category&&String(r.category).trim())||inferCat(r.clubId)}));
  if(category!=="all")pool=pool.filter(r=>r.category===category);
  const clubList=category==="all"?allClubs():CATEGORIES[category].data;
  const presentClubs=clubList.filter(c=>pool.some(r=>r.clubId===c.id));
  const byStudent={};pool.forEach(r=>{const k=`${r.classNo}|${r.seatNo}|${r.studentName}`;(byStudent[k]||=[]).push(r);});
  const stus=Object.values(byStudent).sort((a,b)=>{const A=a[0],B=b[0];return String(A.classNo).localeCompare(String(B.classNo))||String(A.seatNo).localeCompare(String(B.seatNo));});
  const head=["序號","班級","座號","姓名","合計",...presentClubs.map(c=>c.name)];
  const rows=stus.map((stu,i)=>{const r=stu[0];const map={};stu.forEach(x=>map[x.clubId]=x.totalFee);const fees=presentClubs.map(c=>map[c.id]||"");const total=stu.reduce((s,x)=>s+x.totalFee,0);return[i+1,r.classNo,r.seatNo,r.studentName,total,...fees];});
  return{head,rows,clubs:presentClubs};
}
async function exportPayment(category,btn){
  const titleMap={"115":"預算(115學年度)","summer":"預算(暑假社團)","phase1":"預算(第一階段)","phase2":"預算(第二階段)","grade1":"預算(小一社團)","all":"預算(全部社團)"};
  const title=titleMap[category];const origText=btn?btn.textContent:null;
  if(btn){btn.disabled=true;btn.textContent="產生中…";}
  try{
    const inferCat=(id)=>{const s=String(id||"");if(s.startsWith("SUM"))return"summer";if(s.startsWith("G1"))return"grade1";return"115";};
    let regs=state.registrations.map(r=>({...r,category:(r.category&&String(r.category).trim())||inferCat(r.clubId)}));
    if(category==="phase1"){const p=new Date("2026-06-20");regs=regs.filter(r=>(r.category==="115"||r.category==="summer")&&new Date(r.timestamp)<p);}
    else if(category==="phase2"){const p1=new Date("2026-06-20"),p2=new Date("2026-06-23");regs=regs.filter(r=>r.category==="115"&&new Date(r.timestamp)>=p1&&new Date(r.timestamp)<p2);}
    else if(category!=="all")regs=regs.filter(r=>r.category===category);
    const clubSet=new Map();regs.forEach(r=>{const label=r.category==="summer"?`${r.clubName}(暑)`:r.clubName;if(!clubSet.has(label))clubSet.set(label,r.category);});
    const clubs=Array.from(clubSet.entries()).sort((a,b)=>{if(a[1]==="summer"&&b[1]!=="summer")return 1;if(a[1]!=="summer"&&b[1]==="summer")return -1;return a[0].localeCompare(b[0]);}).map(([name])=>name);
    const studentMap=new Map();regs.forEach(r=>{const key=`${r.classNo}-${r.seatNo}-${r.studentName}`;if(!studentMap.has(key))studentMap.set(key,{classNo:r.classNo,seatNo:r.seatNo,studentName:r.studentName,clubs:{}});const label=r.category==="summer"?`${r.clubName}(暑)`:r.clubName;studentMap.get(key).clubs[label]=r.totalFee;});
    const students=Array.from(studentMap.values()).sort((a,b)=>String(a.classNo).localeCompare(String(b.classNo))||String(a.seatNo).localeCompare(String(b.seatNo)));
    const headers=["序號","班級","座號","姓名","合計",...clubs];
    const wsData=[[title],[],headers,...students.map((s,idx)=>{const total=Object.values(s.clubs).reduce((sum,v)=>sum+(v||0),0);return[idx+1,s.classNo,s.seatNo,s.studentName,total,...clubs.map(c=>s.clubs[c]||"")];})];
    const ws=XLSX.utils.aoa_to_sheet(wsData);ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:headers.length-1}}];ws["!cols"]=[{wch:6},{wch:8},{wch:6},{wch:10},{wch:10},...clubs.map(()=>({wch:12}))];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,title.slice(0,30));XLSX.writeFile(wb,`雙蓮國小_${title}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){alert("匯出失敗："+e.message);}
  finally{if(btn){btn.disabled=false;btn.textContent=origText;}}
}
function renderSettings(body){
  body.innerHTML=`<div class="card" style="padding:24px 28px;max-width:640px"><h3 style="margin-top:0">系統設定</h3><div class="divider"></div><h4>📦 資料管理</h4><div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><button class="btn" id="se-export">下載備份 JSON</button><button class="btn" id="se-import">匯入備份 JSON</button><button class="btn" id="se-clear" style="background:var(--danger);color:#fff;border-color:var(--danger)">⚠ 清空所有報名</button></div><div class="divider"></div><h4>🔑 後台密碼</h4><p class="muted" style="font-size:13px">目前後台密碼：<code>${ADMIN_PASSWORD}</code></p></div>`;
  $("#se-export").onclick=()=>downloadFile(`雙蓮國小_報名資料_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state.registrations,null,2),"application/json");
  $("#se-import").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="application/json";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw new Error("格式錯誤");if(!confirm(`即將匯入 ${arr.length} 筆資料，確定？`))return;state.registrations=arr;saveRegs();alert("匯入成功！");renderAdmin();}catch(err){alert("匯入失敗："+err.message);}};r.readAsText(f);};inp.click();};
  $("#se-clear").onclick=()=>{if(confirm("確定清空所有報名資料？此動作無法復原。")){state.registrations=[];saveRegs();renderAdmin();}};
}

/* ── UTILS ── */
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

/* ── BOOT ── */
$$(".nav-btn").forEach(b=>b.onclick=()=>go(b.dataset.nav));
$("#adminGear").onclick=()=>{if(state.isAdmin){state.view="admin";render();return;}$("#loginModal").classList.add("show");$("#adminPass").value="";$("#loginErr").style.display="none";setTimeout(()=>$("#adminPass").focus(),50);};
$("#loginCancel").onclick=()=>$("#loginModal").classList.remove("show");
$("#loginOk").onclick=tryLogin;
$("#adminPass").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
function tryLogin(){if($("#adminPass").value===ADMIN_PASSWORD){state.isAdmin=true;$("#loginModal").classList.remove("show");state.view="admin";render();}else{$("#loginErr").style.display="block";}}

(async()=>{
  if(API_URL){const remote=await fetchRemoteRegs();if(remote){state.registrations=remote;saveRegs();}}
  render();
})();
